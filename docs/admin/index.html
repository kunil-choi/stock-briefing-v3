<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Briefing Admin</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #252530;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e8e8f0;
      --text-muted: #8888aa;
      --border: #2e2e3e;
      --up: #26c281;
      --down: #e74c3c;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text);
           font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

    /* ── 로그인 오버레이 ── */
    #loginOverlay {
      position: fixed; inset: 0;
      background: rgba(15,15,19,0.97);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px; width: 380px;
      box-shadow: var(--shadow);
    }
    .login-box h2 {
      text-align: center; margin-bottom: 8px;
      color: var(--accent); font-size: 1.3rem;
    }
    .login-subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .form-section {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .form-section-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .form-group { margin-bottom: 12px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label {
      display: block; margin-bottom: 5px;
      font-size: 0.82rem; color: var(--text-muted);
    }
    .form-group input {
      width: 100%; padding: 10px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
      transition: border-color .2s;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .btn-primary {
      width: 100%; padding: 12px;
      background: var(--accent); color: white;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.95rem; font-weight: 600;
      transition: opacity 0.2s; margin-top: 4px;
    }
    .btn-primary:hover { opacity: 0.85; }
    .login-error {
      color: var(--down);
      font-size: 0.82rem;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
    }

    /* ── 헤더 ── */
    .admin-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-header h1 { font-size: 1.2rem; color: var(--accent); }
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-save { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-save:hover { opacity: 0.85; }
    .btn-danger { border-color: var(--down); color: var(--down); }
    .btn-danger:hover { background: rgba(231,76,60,0.1); }

    /* ── 탭 ── */
    .main-tabs {
      display: flex; gap: 4px;
      padding: 12px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .main-tab {
      padding: 8px 20px; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem;
      border: 1px solid transparent;
      color: var(--text-muted); white-space: nowrap;
      background: none; transition: all 0.2s;
    }
    .main-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .main-tab:hover:not(.active) { border-color: var(--border); color: var(--text); }

    /* ── 콘텐츠 ── */
    .tab-content { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .tab-content.active { display: block; }

    /* ── 통계 ── */
    .stats-bar { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px; font-size: 0.85rem;
    }
    .stat-num { font-size: 1.2rem; font-weight: 700; color: var(--accent); }

    /* ── 채널 그리드 ── */
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .channel-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; transition: border-color 0.2s;
    }
    .channel-card:hover { border-color: var(--accent); }
    .channel-card.confirmed   { border-left: 3px solid var(--up); }
    .channel-card.unconfirmed { border-left: 3px solid var(--text-muted); }
    .channel-card.candidate   { border-left: 3px solid orange; }
    .ch-name  { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
    .ch-id    { font-size: 0.75rem; color: var(--accent); font-family: monospace;
                word-break: break-all; margin-bottom: 4px; }
    .ch-subs  { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .ch-note  { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }
    .ch-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .ch-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 0.78rem;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); transition: all 0.2s;
    }
    .ch-btn:hover { border-color: var(--accent); }
    .ch-btn.danger  { border-color: var(--down); color: var(--down); }
    .ch-btn.danger:hover  { background: rgba(231,76,60,0.1); }
    .ch-btn.success { border-color: var(--up); color: var(--up); }
    .ch-btn.success:hover { background: rgba(38,194,129,0.1); }

    /* ── 일괄 작업 ── */
    .bulk-actions { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

    /* ── 채널 추가 폼 ── */
    .add-channel-form {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
    }
    .add-channel-form h3 { margin-bottom: 16px; color: var(--accent); }
    .form-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px; margin-bottom: 16px;
    }
    .form-group-inner label {
      display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;
    }
    .form-group-inner input, .form-group-inner select {
      width: 100%; padding: 8px 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.88rem;
    }
    .form-group-inner input:focus, .form-group-inner select:focus {
      outline: none; border-color: var(--accent);
    }

    /* ── 지난 브리핑 ── */
    .archive-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .archive-section-header h3 { color: var(--accent); font-size: 1rem; }
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .archive-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .archive-card:hover { border-color: var(--accent); }
    .archive-date {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }
    .archive-date span {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .archive-actions { display: flex; gap: 6px; }
    .archive-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 30px 0;
      text-align: center;
    }
    .archive-loading {
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 20px 0;
      text-align: center;
    }

    /* ── 모달 ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      width: 480px; max-width: 95vw; max-height: 90vh;
      overflow-y: auto; box-shadow: var(--shadow);
    }
    .modal h3 { margin-bottom: 18px; color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* ── 토스트 ── */
    #toastContainer {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px; z-index: 9998;
    }
    .toast {
      padding: 12px 20px; border-radius: 8px;
      font-size: 0.88rem; font-weight: 500;
      animation: slideIn 0.3s ease; max-width: 320px;
    }
    .toast.success { background: var(--up); color: white; }
    .toast.error   { background: var(--down); color: white; }
    .toast.info    { background: var(--accent); color: white; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    /* ── 진행바 ── */
    .progress-bar {
      height: 4px; background: var(--surface2);
      border-radius: 2px; margin: 8px 0; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  </style>
</head>
<body>

<!-- ===== 로그인 오버레이 ===== -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔐 관리자 로그인</h2>
    <p class="login-subtitle" id="loginSubtitle">비밀번호를 입력하세요</p>

    <div class="form-section">
      <div class="form-section-title">🔑 인증</div>
      <div class="form-group">
        <label>관리자 비밀번호</label>
        <input type="password" id="inputPw" placeholder="비밀번호 입력"
               onkeydown="if(event.key==='Enter')login()">
      </div>
    </div>

    <div class="form-section" id="apiKeySection" style="display:none;">
      <div class="form-section-title">🔧 GitHub Token 등록 (최초 1회)</div>
      <div class="form-group">
        <label>GitHub Token <span style="color:var(--down)">*필수</span></label>
        <input type="password" id="inputGhToken" placeholder="ghp_xxxxxxxxxxxx"
               onkeydown="if(event.key==='Enter')login()">
      </div>
      <p style="font-size:0.75rem;color:var(--text-muted);margin-top:8px;">
        ⓘ 입력한 토큰은 이 브라우저에 저장됩니다.<br>
        다음 방문부터는 비밀번호만 입력하면 됩니다.
      </p>
    </div>

    <button class="btn-primary" onclick="login()">로그인</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ===== 관리자 헤더 ===== -->
<div class="admin-header">
  <h1>📊 Stock Briefing Admin</h1>
  <div class="header-actions">
    <button class="btn btn-save" onclick="saveToGitHub()">💾 GitHub 저장</button>
    <button class="btn btn-danger" onclick="logout()">로그아웃</button>
  </div>
</div>

<!-- ===== 탭 ===== -->
<div class="main-tabs">
  <button class="main-tab active" onclick="switchTab('tab-youtuber', this)">유튜버</button>
  <button class="main-tab" onclick="switchTab('tab-broadcast', this)">방송/뉴스</button>
  <button class="main-tab" onclick="switchTab('tab-securities', this)">증권사</button>
  <button class="main-tab" onclick="switchTab('tab-add', this)">+ 채널 추가</button>
  <button class="main-tab" onclick="switchTab('tab-archive', this); loadArchive()">🗂 지난 브리핑</button>
</div>

<!-- ===== 탭 콘텐츠 ===== -->
<div id="tab-youtuber" class="tab-content active">
  <div class="stats-bar" id="statsYoutuber"></div>
  <div class="bulk-actions">
    <button class="btn" onclick="bulkVerify('youtuber')">일괄 검증</button>
    <button class="btn success" onclick="bulkApprove('youtuber')">일괄 승인</button>
  </div>
  <div class="channel-grid" id="gridYoutuber"></div>
</div>

<div id="tab-broadcast" class="tab-content">
  <div class="stats-bar" id="statsBroadcast"></div>
  <div class="bulk-actions">
    <button class="btn" onclick="bulkVerify('broadcast')">일괄 검증</button>
    <button class="btn success" onclick="bulkApprove('broadcast')">일괄 승인</button>
  </div>
  <div class="channel-grid" id="gridBroadcast"></div>
</div>

<div id="tab-securities" class="tab-content">
  <div class="stats-bar" id="statsSecurities"></div>
  <div class="bulk-actions">
    <button class="btn" onclick="bulkVerify('securities')">일괄 검증</button>
    <button class="btn success" onclick="bulkApprove('securities')">일괄 승인</button>
  </div>
  <div class="channel-grid" id="gridSecurities"></div>
</div>

<div id="tab-add" class="tab-content">
  <div class="add-channel-form">
    <h3>➕ 새 채널 추가</h3>
    <div class="form-grid">
      <div class="form-group-inner">
        <label>채널명 *</label>
        <input type="text" id="addName" placeholder="예: 슈카월드">
      </div>
      <div class="form-group-inner">
        <label>YouTube URL 또는 @핸들</label>
        <input type="text" id="addUrl" placeholder="https://youtube.com/@...">
      </div>
      <div class="form-group-inner">
        <label>채널 ID (UCxxx)</label>
        <input type="text" id="addId" placeholder="API로 자동 조회 가능">
      </div>
      <div class="form-group-inner">
        <label>카테고리</label>
        <select id="addCategory">
          <option value="youtuber">유튜버</option>
          <option value="broadcast">방송/뉴스</option>
          <option value="securities">증권사</option>
        </select>
      </div>
      <div class="form-group-inner">
        <label>메모</label>
        <input type="text" id="addNote" placeholder="특이사항 메모">
      </div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn" onclick="fetchChannelInfo()">YouTube API로 정보 가져오기</button>
      <button class="btn btn-save" onclick="addChannel()">채널 추가</button>
    </div>
  </div>
</div>

<!-- ===== 지난 브리핑 탭 ===== -->
<div id="tab-archive" class="tab-content">
  <div class="archive-section-header">
    <h3>🗂 지난 브리핑 목록</h3>
    <button class="btn" onclick="loadArchive()">🔄 새로고침</button>
  </div>
  <div id="archiveGrid" class="archive-grid">
    <p class="archive-loading">탭을 클릭하면 목록을 불러옵니다.</p>
  </div>
</div>

<!-- ===== 편집 모달 ===== -->
<div id="editModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>채널 편집</h3>
    <input type="hidden" id="editCategory">
    <input type="hidden" id="editIndex">
    <div class="form-group" style="margin-bottom:12px">
      <label style="font-size:0.8rem;color:var(--text-muted)">채널명</label>
      <input type="text" id="editName"
             style="width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label style="font-size:0.8rem;color:var(--text-muted)">채널 ID</label>
      <input type="text" id="editId"
             style="width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label style="font-size:0.8rem;color:var(--text-muted)">URL</label>
      <input type="text" id="editUrl"
             style="width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label style="font-size:0.8rem;color:var(--text-muted)">구독자 수</label>
      <input type="number" id="editSubs"
             style="width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label style="font-size:0.8rem;color:var(--text-muted)">메모</label>
      <input type="text" id="editNote"
             style="width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label style="font-size:0.8rem;color:var(--text-muted)">상태</label>
      <select id="editStatus"
              style="width:100%;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
        <option value="confirmed">confirmed</option>
        <option value="unconfirmed">unconfirmed</option>
        <option value="candidate">candidate</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeEditModal()">취소</button>
      <button class="btn btn-save" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<!-- ===== 토스트 컨테이너 ===== -->
<div id="toastContainer"></div>

<script>
// ================================================================
//  설정 상수
// ================================================================
const REPO            = 'kunil-choi/stock-briefing-v3';
const CHANNELS_FILE   = 'channels.json';
const CANDIDATES_FILE = 'candidates.json';
const MIN_VIEWS       = 10000;

const PW_HASH     = 'd3245607e1c80030349094f0ea642bc3c9e28714640e528f22671b50bc2f15f4';
const LS_GH_TOKEN = 'sbv3_gh_token';
const LS_YT_KEY   = 'sbv3_yt_key';
const LS_PW_SET   = 'sbv3_pw_verified';
const SS_AUTHED   = 'sbv3_authed';

// ================================================================
//  전역 상태
// ================================================================
let ghToken      = '';
let ytKey        = '';
let channelsData = { broadcast: [], youtuber: [], securities: [], meta: {} };
let archiveLoaded = false;

// ================================================================
//  SHA-256
// ================================================================
async function sha256(message) {
  const msgBuffer  = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray  = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ================================================================
//  페이지 로드 초기화
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
  const hasToken = localStorage.getItem(LS_PW_SET) === 'true';

  if (hasToken) {
    document.getElementById('apiKeySection').style.display = 'none';
    document.getElementById('loginSubtitle').textContent =
      '비밀번호를 입력하면 자동으로 연결됩니다.';
  } else {
    document.getElementById('apiKeySection').style.display = 'block';
    document.getElementById('loginSubtitle').textContent =
      '최초 로그인입니다. 비밀번호와 GitHub Token을 입력하세요.';
  }

  if (sessionStorage.getItem(SS_AUTHED) === 'true') {
    ghToken = localStorage.getItem(LS_GH_TOKEN) || '';
    if (ghToken) {
      document.getElementById('loginOverlay').style.display = 'none';
      loadChannels();
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' &&
        document.getElementById('loginOverlay').style.display !== 'none') {
      login();
    }
  });
});

// ================================================================
//  로그인
// ================================================================
async function login() {
  const pw      = document.getElementById('inputPw').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  if (!pw) { errorEl.textContent = '비밀번호를 입력하세요.'; return; }

  const inputHash = await sha256(pw);
  if (inputHash !== PW_HASH) {
    errorEl.textContent = '❌ 비밀번호가 틀렸습니다.';
    document.getElementById('inputPw').value = '';
    return;
  }

  const hasToken = localStorage.getItem(LS_PW_SET) === 'true';

  if (!hasToken) {
    const newGhToken = document.getElementById('inputGhToken').value.trim();
    if (!newGhToken) {
      document.getElementById('loginError').textContent = '❌ GitHub Token은 필수입니다.';
      return;
    }
    localStorage.setItem(LS_GH_TOKEN, newGhToken);
    localStorage.setItem(LS_PW_SET,   'true');
    ghToken = newGhToken;
    showToast('✅ GitHub Token이 저장되었습니다. 다음부터는 비밀번호만 입력하세요.', 'success');
  } else {
    ghToken = localStorage.getItem(LS_GH_TOKEN) || '';
  }

  sessionStorage.setItem(SS_AUTHED, 'true');
  document.getElementById('loginOverlay').style.display = 'none';
  loadChannels();
  showToast('✅ 로그인 성공!', 'success');
}

// ================================================================
//  로그아웃
// ================================================================
function logout() {
  if (!confirm('로그아웃하시겠습니까?\n(저장된 API 키는 유지됩니다)')) return;
  sessionStorage.removeItem(SS_AUTHED);
  location.reload();
}

function resetApiKeys() {
  if (!confirm('저장된 GitHub Token을 삭제하고 다시 등록하시겠습니까?')) return;
  localStorage.removeItem(LS_GH_TOKEN);
  localStorage.removeItem(LS_PW_SET);
  sessionStorage.removeItem(SS_AUTHED);
  location.reload();
}

// ================================================================
//  GitHub API 헬퍼
// ================================================================
async function ghGet(path) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    headers: {
      Authorization: `token ${ghToken}`,
      Accept: 'application/vnd.github.v3+json'
    }
  });
  if (!res.ok) throw new Error(`GitHub GET 실패: ${res.status} ${path}`);
  return res.json();
}

async function ghPut(path, content, sha, message) {
  const body = { message, content: btoa(unescape(encodeURIComponent(content))) };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: {
      Authorization: `token ${ghToken}`,
      Accept: 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(`GitHub PUT 실패: ${res.status} - ${err.message}`);
  }
  return res.json();
}

// ================================================================
//  채널 데이터 로드
// ================================================================
async function loadChannels() {
  try {
    const file = await ghGet(CHANNELS_FILE);
    const raw  = decodeURIComponent(escape(atob(file.content)));
    channelsData = JSON.parse(raw);
    ['broadcast', 'youtuber', 'securities'].forEach(k => {
      if (!channelsData[k]) channelsData[k] = [];
    });
    renderAll();
    showToast('채널 데이터 로드 완료', 'info');
  } catch (e) {
    showToast(`채널 로드 실패: ${e.message}`, 'error');
    console.error(e);
  }
}

// ================================================================
//  지난 브리핑 로드
// ================================================================
async function loadArchive() {
  const grid = document.getElementById('archiveGrid');
  grid.innerHTML = '<p class="archive-loading">불러오는 중...</p>';
  archiveLoaded = false;

  try {
    const files = await ghGet('docs/archive');

    const htmlFiles = files
      .filter(f => f.name.endsWith('.html'))
      .sort((a, b) => b.name.localeCompare(a.name));

    if (!htmlFiles.length) {
      grid.innerHTML = '<p class="archive-empty">저장된 브리핑이 없습니다.</p>';
      return;
    }

    const [owner, repo] = REPO.split('/');
    grid.innerHTML = htmlFiles.map(f => {
      const dateMatch = f.name.match(/(\d{4})(\d{2})(\d{2})/);
      const dateLabel = dateMatch
        ? `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}`
        : f.name.replace('.html', '');
      const dayNames  = ['일', '월', '화', '수', '목', '금', '토'];
      let dayLabel    = '';
      if (dateMatch) {
        const d   = new Date(`${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}`);
        dayLabel  = isNaN(d) ? '' : dayNames[d.getDay()] + '요일';
      }
      const pageUrl = `https://${owner}.github.io/${repo}/archive/${f.name}`;

      return `
        <div class="archive-card">
          <div class="archive-date">
            ${dateLabel}
            <span>${dayLabel}</span>
          </div>
          <div class="archive-actions">
            <a href="${pageUrl}" target="_blank" rel="noopener" class="btn" style="font-size:0.78rem;padding:5px 10px;">
              열기
            </a>
            <button class="ch-btn danger" onclick="deleteArchive('${f.path}', '${f.sha}', '${f.name}', this.closest('.archive-card'))">
              삭제
            </button>
          </div>
        </div>`;
    }).join('');

    archiveLoaded = true;
    showToast(`브리핑 ${htmlFiles.length}개 로드 완료`, 'info');
  } catch (e) {
    grid.innerHTML = `<p class="archive-empty">로드 실패: ${e.message}</p>`;
    showToast(`아카이브 로드 실패: ${e.message}`, 'error');
  }
}

// ================================================================
//  아카이브 파일 삭제
// ================================================================
async function deleteArchive(filePath, fileSha, fileName, cardEl) {
  if (!confirm(`"${fileName}" 브리핑을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
  try {
    showToast('삭제 중...', 'info');
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${filePath}`, {
      method: 'DELETE',
      headers: {
        Authorization: `token ${ghToken}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `admin: 아카이브 삭제 ${fileName}`,
        sha: fileSha
      })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message);
    }
    cardEl.remove();
    showToast(`✅ "${fileName}" 삭제 완료`, 'success');
  } catch (e) {
    showToast(`삭제 실패: ${e.message}`, 'error');
  }
}

// ================================================================
//  렌더링
// ================================================================
function renderAll() {
  renderCategory('youtuber',   'gridYoutuber',   'statsYoutuber');
  renderCategory('broadcast',  'gridBroadcast',  'statsBroadcast');
  renderCategory('securities', 'gridSecurities', 'statsSecurities');
}

function renderCategory(category, gridId, statsId) {
  const channels    = channelsData[category] || [];
  const confirmed   = channels.filter(c => c.status === 'confirmed').length;
  const unconfirmed = channels.length - confirmed;

  document.getElementById(statsId).innerHTML = `
    <div class="stat-item">전체 <div class="stat-num">${channels.length}</div></div>
    <div class="stat-item">확인됨 <div class="stat-num" style="color:var(--up)">${confirmed}</div></div>
    <div class="stat-item">미확인 <div class="stat-num" style="color:var(--text-muted)">${unconfirmed}</div></div>
  `;

  const grid = document.getElementById(gridId);
  if (!channels.length) {
    grid.innerHTML = '<p style="color:var(--text-muted);padding:20px">등록된 채널이 없습니다.</p>';
    return;
  }

  grid.innerHTML = channels.map((ch, idx) => `
    <div class="channel-card ${ch.status || 'unconfirmed'}">
      <div class="ch-name">${ch.name || '이름 없음'}</div>
      <div class="ch-id">${ch.id || '채널 ID 없음'}</div>
      <div class="ch-subs">${ch.subscribers ? ch.subscribers.toLocaleString() + '명' : '구독자 미확인'}</div>
      ${ch.note ? `<div class="ch-note">${ch.note}</div>` : ''}
      <div class="ch-actions">
        <button class="ch-btn" onclick="openEditModal('${category}', ${idx})">편집</button>
        <button class="ch-btn success" onclick="verifyChannel('${category}', ${idx})">검증</button>
        <button class="ch-btn danger" onclick="removeChannel('${category}', ${idx})">삭제</button>
      </div>
    </div>
  `).join('');
}

// ================================================================
//  탭 전환
// ================================================================
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.main-tab').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  if (btn) btn.classList.add('active');
}

// ================================================================
//  편집 모달
// ================================================================
function openEditModal(category, idx) {
  const ch = channelsData[category][idx];
  document.getElementById('editCategory').value = category;
  document.getElementById('editIndex').value    = idx;
  document.getElementById('editName').value     = ch.name        || '';
  document.getElementById('editId').value       = ch.id          || '';
  document.getElementById('editUrl').value      = ch.url         || '';
  document.getElementById('editSubs').value     = ch.subscribers || 0;
  document.getElementById('editNote').value     = ch.note        || '';
  document.getElementById('editStatus').value   = ch.status      || 'unconfirmed';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function saveEdit() {
  const category = document.getElementById('editCategory').value;
  const idx      = parseInt(document.getElementById('editIndex').value);
  channelsData[category][idx] = {
    ...channelsData[category][idx],
    name:        document.getElementById('editName').value.trim(),
    id:          document.getElementById('editId').value.trim(),
    url:         document.getElementById('editUrl').value.trim(),
    subscribers: parseInt(document.getElementById('editSubs').value) || 0,
    note:        document.getElementById('editNote').value.trim(),
    status:      document.getElementById('editStatus').value,
  };
  closeEditModal();
  renderAll();
  showToast('수정 완료 (GitHub 저장 버튼으로 반영하세요)', 'info');
}

// ================================================================
//  채널 삭제
// ================================================================
function removeChannel(category, idx) {
  const ch = channelsData[category][idx];
  if (!confirm(`"${ch.name}"을 삭제하시겠습니까?`)) return;
  channelsData[category].splice(idx, 1);
  renderAll();
  showToast('삭제 완료 (GitHub 저장 버튼으로 반영하세요)', 'info');
}

// ================================================================
//  YouTube API로 채널 정보 조회
// ================================================================
async function fetchChannelInfo() {
  if (!ytKey) {
    showToast('YouTube API Key가 없습니다. 로그아웃 후 재등록하세요.', 'error');
    return;
  }
  const urlOrHandle = document.getElementById('addUrl').value.trim();
  if (!urlOrHandle) { showToast('URL 또는 @핸들을 입력하세요.', 'error'); return; }

  let handle = urlOrHandle;
  if (urlOrHandle.includes('youtube.com/@')) {
    handle = urlOrHandle.split('@').pop().split('/')[0];
  } else if (urlOrHandle.startsWith('@')) {
    handle = urlOrHandle.slice(1);
  }

  try {
    showToast('YouTube API 조회 중...', 'info');
    const res  = await fetch(
      `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${encodeURIComponent(handle)}&key=${ytKey}`
    );
    const data  = await res.json();
    const items = data.items || [];
    if (!items.length) { showToast('채널을 찾을 수 없습니다.', 'error'); return; }
    const ch   = items[0];
    document.getElementById('addId').value = ch.id;
    if (!document.getElementById('addName').value) {
      document.getElementById('addName').value = ch.snippet.title;
    }
    const subs = parseInt(ch.statistics.subscriberCount) || 0;
    showToast(`조회 성공: ${ch.snippet.title} (구독자 ${subs.toLocaleString()}명)`, 'success');
  } catch (e) {
    showToast(`API 오류: ${e.message}`, 'error');
  }
}

// ================================================================
//  채널 추가
// ================================================================
function addChannel() {
  const name     = document.getElementById('addName').value.trim();
  const url      = document.getElementById('addUrl').value.trim();
  const id       = document.getElementById('addId').value.trim();
  const category = document.getElementById('addCategory').value;
  const note     = document.getElementById('addNote').value.trim();

  if (!name) { showToast('채널명을 입력하세요.', 'error'); return; }

  const newCh = {
    name, id: id || '', url: url || '',
    subscribers: 0, note: note || '',
    status: id ? 'confirmed' : 'unconfirmed',
  };

  if (!channelsData[category]) channelsData[category] = [];
  channelsData[category].push(newCh);
  renderAll();

  ['addName', 'addUrl', 'addId', 'addNote'].forEach(id => {
    document.getElementById(id).value = '';
  });

  showToast(`"${name}" 추가! (GitHub 저장 필요)`, 'success');
  switchTab('tab-' + category, null);
}

// ================================================================
//  채널 검증
// ================================================================
async function verifyChannel(category, idx) {
  if (!ytKey) {
    showToast('YouTube API Key가 없습니다. 로그아웃 후 재등록하세요.', 'error');
    return;
  }
  const ch = channelsData[category][idx];
  if (!ch.id) { showToast(`${ch.name}: 채널 ID가 없습니다.`, 'error'); return; }

  showToast(`${ch.name} 검증 중...`, 'info');
  try {
    const playlistId = 'UU' + ch.id.slice(2);
    const plRes      = await fetch(
      `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=10&key=${ytKey}`
    );
    const plData  = await plRes.json();
    const videoIds = (plData.items || [])
      .map(i => i.snippet?.resourceId?.videoId).filter(Boolean);

    if (!videoIds.length) { showToast(`${ch.name}: 최근 영상 없음`, 'error'); return; }

    const statsRes  = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds.join(',')}&key=${ytKey}`
    );
    const statsData = await statsRes.json();
    const views     = (statsData.items || [])
      .map(i => parseInt(i.statistics?.viewCount || '0'));
    const maxViews  = Math.max(...views);

    if (maxViews >= MIN_VIEWS) {
      channelsData[category][idx].status = 'confirmed';
      showToast(`✅ ${ch.name}: 검증 통과 (최고 조회수 ${maxViews.toLocaleString()})`, 'success');
    } else {
      showToast(`❌ ${ch.name}: 기준 미달 (${maxViews.toLocaleString()} / 기준 ${MIN_VIEWS.toLocaleString()})`, 'error');
    }
    renderAll();
  } catch (e) {
    showToast(`검증 오류: ${e.message}`, 'error');
  }
}

// ================================================================
//  일괄 검증 / 승인
// ================================================================
async function bulkVerify(category) {
  if (!ytKey) { showToast('YouTube API Key가 없습니다.', 'error'); return; }
  const channels = channelsData[category] || [];
  const toVerify = channels.filter(c => c.id && c.status !== 'confirmed');
  if (!toVerify.length) { showToast('검증할 채널이 없습니다.', 'info'); return; }
  showToast(`${toVerify.length}개 채널 검증 시작...`, 'info');
  for (let i = 0; i < channels.length; i++) {
    if (channels[i].id && channels[i].status !== 'confirmed') {
      await verifyChannel(category, i);
      await new Promise(r => setTimeout(r, 300));
    }
  }
  showToast('일괄 검증 완료!', 'success');
}

function bulkApprove(category) {
  if (!confirm(`${category}의 ID 있는 채널을 모두 승인하시겠습니까?`)) return;
  let count = 0;
  (channelsData[category] || []).forEach(ch => {
    if (ch.id && ch.status !== 'confirmed') { ch.status = 'confirmed'; count++; }
  });
  renderAll();
  showToast(`${count}개 승인 완료 (GitHub 저장 필요)`, 'success');
}

// ================================================================
//  GitHub 저장
// ================================================================
async function saveToGitHub() {
  if (!confirm('channels.json을 GitHub에 저장하시겠습니까?')) return;
  try {
    showToast('저장 중...', 'info');
    const file = await ghGet(CHANNELS_FILE);
    channelsData.meta = channelsData.meta || {};
    channelsData.meta.last_updated = new Date().toISOString().split('T')[0];
    const content = JSON.stringify(channelsData, null, 2);
    await ghPut(CHANNELS_FILE, content, file.sha,
      `admin: channels.json 업데이트 ${channelsData.meta.last_updated}`);
    showToast('✅ GitHub 저장 완료!', 'success');
  } catch (e) {
    showToast(`저장 실패: ${e.message}`, 'error');
    console.error(e);
  }
}

// ================================================================
//  토스트
// ================================================================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast     = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}
