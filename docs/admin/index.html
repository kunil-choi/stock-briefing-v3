<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Briefing Admin</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #252530;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e8e8f0;
      --text-muted: #8888aa;
      --border: #2e2e3e;
      --up: #26c281;
      --down: #e74c3c;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text);
           font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

    /* ===== Login Overlay ===== */
    #loginOverlay {
      position: fixed; inset: 0;
      background: rgba(15,15,19,0.97);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px; width: 360px;
      box-shadow: var(--shadow);
    }
    .login-box h2 { text-align: center; margin-bottom: 24px; color: var(--accent); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px;
                         font-size: 0.85rem; color: var(--text-muted); }
    .form-group input {
      width: 100%; padding: 10px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .btn-primary {
      width: 100%; padding: 12px;
      background: var(--accent); color: white;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.95rem; font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }

    /* ===== Header ===== */
    .admin-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-header h1 { font-size: 1.2rem; color: var(--accent); }
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-save { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-save:hover { opacity: 0.85; }
    .btn-danger { border-color: var(--down); color: var(--down); }
    .btn-danger:hover { background: rgba(231,76,60,0.1); }

    /* ===== Tabs ===== */
    .main-tabs {
      display: flex; gap: 4px;
      padding: 12px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .main-tab {
      padding: 8px 20px; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem;
      border: 1px solid transparent;
      color: var(--text-muted); white-space: nowrap;
      background: none;
      transition: all 0.2s;
    }
    .main-tab.active {
      background: var(--accent); color: white;
      border-color: var(--accent);
    }
    .main-tab:hover:not(.active) {
      border-color: var(--border); color: var(--text);
    }

    /* ===== Content ===== */
    .tab-content { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .tab-content.active { display: block; }

    /* ===== Stats Bar ===== */
    .stats-bar {
      display: flex; gap: 16px; margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px;
      font-size: 0.85rem;
    }
    .stat-num { font-size: 1.2rem; font-weight: 700; color: var(--accent); }

    /* ===== Channel Grid ===== */
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .channel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: border-color 0.2s;
    }
    .channel-card:hover { border-color: var(--accent); }
    .channel-card.confirmed { border-left: 3px solid var(--up); }
    .channel-card.unconfirmed { border-left: 3px solid var(--text-muted); }
    .channel-card.candidate { border-left: 3px solid orange; }

    .ch-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
    .ch-id { font-size: 0.75rem; color: var(--accent); font-family: monospace;
              word-break: break-all; margin-bottom: 4px; }
    .ch-subs { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .ch-note { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;
               font-style: italic; }
    .ch-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .ch-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 0.78rem;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text);
      transition: all 0.2s;
    }
    .ch-btn:hover { border-color: var(--accent); }
    .ch-btn.danger { border-color: var(--down); color: var(--down); }
    .ch-btn.danger:hover { background: rgba(231,76,60,0.1); }
    .ch-btn.success { border-color: var(--up); color: var(--up); }
    .ch-btn.success:hover { background: rgba(38,194,129,0.1); }

    /* ===== Bulk Actions ===== */
    .bulk-actions {
      display: flex; gap: 10px; margin-bottom: 16px;
      flex-wrap: wrap;
    }

    /* ===== Add Channel Form ===== */
    .add-channel-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .add-channel-form h3 { margin-bottom: 16px; color: var(--accent); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .form-group-inner { }
    .form-group-inner label { display: block; font-size: 0.8rem;
                               color: var(--text-muted); margin-bottom: 4px; }
    .form-group-inner input, .form-group-inner select {
      width: 100%; padding: 8px 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.88rem;
    }
    .form-group-inner input:focus, .form-group-inner select:focus {
      outline: none; border-color: var(--accent);
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px; width: 480px; max-width: 95vw;
      max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow);
    }
    .modal h3 { margin-bottom: 18px; color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* ===== Toast ===== */
    #toastContainer {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 9998;
    }
    .toast {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      animation: slideIn 0.3s ease;
      max-width: 320px;
    }
    .toast.success { background: var(--up); color: white; }
    .toast.error { background: var(--down); color: white; }
    .toast.info { background: var(--accent); color: white; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ===== Progress ===== */
    .progress-bar {
      height: 4px; background: var(--surface2);
      border-radius: 2px; margin: 8px 0; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

<!-- ===== Toast Container ===== -->

<script>
// ===== 상수 =====
const REPO = 'kunil-choi/stock-briefing-v3';
const CHANNELS_FILE = 'channels.json';
const CANDIDATES_FILE = 'candidates.json';
const ADMIN_PASSWORD = '%%ADMIN_PASSWORD%%';  // html_generator.py에서 주입
const MIN_VIEWS = 10000;

// ===== 전역 상태 =====
let ghToken = '';
let ytKey = '';
let channelsData = { broadcast: [], youtuber: [], securities: [], meta: {} };

// ===== 인증 =====
function login() {
  const pw = document.getElementById('inputPw').value;
  if (pw !== ADMIN_PASSWORD) {
    showToast('비밀번호가 틀렸습니다.', 'error');
    return;
  }
  ghToken = document.getElementById('inputGhToken').value.trim();
  ytKey = document.getElementById('inputYtKey').value.trim();
  if (!ghToken) {
    showToast('GitHub Token은 필수입니다.', 'error');
    return;
  }
  document.getElementById('loginOverlay').style.display = 'none';
  loadChannels();
  showToast('로그인 성공!', 'success');
}

function logout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  location.reload();
}

// ===== GitHub API =====
async function ghGet(path) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    headers: {
      Authorization: `token ${ghToken}`,
      Accept: 'application/vnd.github.v3+json'
    }
  });
  if (!res.ok) throw new Error(`GitHub GET 실패: ${res.status} ${path}`);
  return res.json();
}

async function ghPut(path, content, sha, message) {
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(content))),
  };
  if (sha) body.sha = sha;

  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: {
      Authorization: `token ${ghToken}`,
      Accept: 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(`GitHub PUT 실패: ${res.status} - ${err.message}`);
  }
  return res.json();
}

// ===== 채널 로드 =====
async function loadChannels() {
  try {
    const file = await ghGet(CHANNELS_FILE);
    const raw = decodeURIComponent(escape(atob(file.content)));
    channelsData = JSON.parse(raw);
    // 필수 키 보장
    ['broadcast', 'youtuber', 'securities'].forEach(k => {
      if (!channelsData[k]) channelsData[k] = [];
    });
    renderAll();
    showToast('채널 데이터 로드 완료', 'info');
  } catch (e) {
    showToast(`채널 로드 실패: ${e.message}`, 'error');
    console.error(e);
  }
}

// ===== 렌더링 =====
function renderAll() {
  renderCategory('youtuber', 'gridYoutuber', 'statsYoutuber');
  renderCategory('broadcast', 'gridBroadcast', 'statsBroadcast');
  renderCategory('securities', 'gridSecurities', 'statsSecurities');
}

function renderCategory(category, gridId, statsId) {
  const channels = channelsData[category] || [];
  const confirmed = channels.filter(c => c.status === 'confirmed').length;
  const unconfirmed = channels.filter(c => c.status !== 'confirmed').length;

  document.getElementById(statsId).innerHTML = `
    <div class="stat-item"><div class="stat-num">${channels.length}</div>전체</div>
    <div class="stat-item"><div class="stat-num" style="color:var(--up)">${confirmed}</div>확인됨</div>
    <div class="stat-item"><div class="stat-num" style="color:var(--text-muted)">${unconfirmed}</div>미확인</div>
  `;

  const grid = document.getElementById(gridId);
  if (!channels.length) {
    grid.innerHTML = '<p style="color:var(--text-muted);padding:20px">등록된 채널이 없습니다.</p>';
    return;
  }

  grid.innerHTML = channels.map((ch, idx) => `
    <div class="channel-card ${ch.status || 'unconfirmed'}">
      <div class="ch-name">${ch.name || '이름 없음'}</div>
      <div class="ch-id">${ch.id || '❌ ID 없음'}</div>
      <div class="ch-subs">${ch.subscribers ? ch.subscribers.toLocaleString() + '명' : '구독자 미상'}</div>
      ${ch.note ? `<div class="ch-note">${ch.note}</div>` : ''}
      <div class="ch-actions">
        <button class="ch-btn" onclick="openEditModal('${category}', ${idx})">✏️ 수정</button>
        <button class="ch-btn success" onclick="verifyChannel('${category}', ${idx})">🔍 검증</button>
        <button class="ch-btn danger" onclick="removeChannel('${category}', ${idx})">🗑️ 삭제</button>
      </div>
    </div>
  `).join('');
}

// ===== 탭 전환 =====
function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.main-tab').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  event.target.classList.add('active');
}

// ===== 채널 편집 =====
function openEditModal(category, idx) {
  const ch = channelsData[category][idx];
  document.getElementById('editCategory').value = category;
  document.getElementById('editIndex').value = idx;
  document.getElementById('editName').value = ch.name || '';
  document.getElementById('editId').value = ch.id || '';
  document.getElementById('editUrl').value = ch.url || '';
  document.getElementById('editSubs').value = ch.subscribers || 0;
  document.getElementById('editNote').value = ch.note || '';
  document.getElementById('editStatus').value = ch.status || 'unconfirmed';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function saveEdit() {
  const category = document.getElementById('editCategory').value;
  const idx = parseInt(document.getElementById('editIndex').value);
  channelsData[category][idx] = {
    ...channelsData[category][idx],
    name: document.getElementById('editName').value.trim(),
    id: document.getElementById('editId').value.trim(),
    url: document.getElementById('editUrl').value.trim(),
    subscribers: parseInt(document.getElementById('editSubs').value) || 0,
    note: document.getElementById('editNote').value.trim(),
    status: document.getElementById('editStatus').value
  };
  closeEditModal();
  renderAll();
  showToast('수정 완료 (저장하려면 GitHub 저장 버튼 클릭)', 'info');
}

// ===== 채널 삭제 =====
function removeChannel(category, idx) {
  const ch = channelsData[category][idx];
  if (!confirm(`"${ch.name}" 채널을 삭제하시겠습니까?`)) return;
  channelsData[category].splice(idx, 1);
  renderAll();
  showToast('삭제 완료 (저장하려면 GitHub 저장 버튼 클릭)', 'info');
}

// ===== YouTube 채널 ID 조회 =====
async function fetchChannelInfo() {
  if (!ytKey) {
    showToast('YouTube API Key가 없습니다. 로그인 시 입력해주세요.', 'error');
    return;
  }
  const urlOrHandle = document.getElementById('addUrl').value.trim();
  if (!urlOrHandle) {
    showToast('URL 또는 @핸들을 입력해주세요.', 'error');
    return;
  }

  // @핸들 추출
  let handle = urlOrHandle;
  if (urlOrHandle.includes('youtube.com/@')) {
    handle = urlOrHandle.split('@').pop().split('/')[0];
  } else if (urlOrHandle.startsWith('@')) {
    handle = urlOrHandle.slice(1);
  }

  try {
    showToast('YouTube API 조회 중...', 'info');
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle=${encodeURIComponent(handle)}&key=${ytKey}`
    );
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) {
      showToast('채널을 찾을 수 없습니다.', 'error');
      return;
    }
    const ch = items[0];
    document.getElementById('addId').value = ch.id;
    if (!document.getElementById('addName').value) {
      document.getElementById('addName').value = ch.snippet.title;
    }
    const subs = parseInt(ch.statistics.subscriberCount) || 0;
    showToast(`채널 조회 완료: ${ch.snippet.title} (구독자 ${subs.toLocaleString()}명)`, 'success');
  } catch (e) {
    showToast(`API 조회 실패: ${e.message}`, 'error');
  }
}

// ===== 채널 추가 =====
function addChannel() {
  const name = document.getElementById('addName').value.trim();
  const url = document.getElementById('addUrl').value.trim();
  const id = document.getElementById('addId').value.trim();
  const category = document.getElementById('addCategory').value;
  const note = document.getElementById('addNote').value.trim();

  if (!name) { showToast('채널명을 입력해주세요.', 'error'); return; }

  const newCh = {
    name,
    id: id || '',
    url: url || '',
    subscribers: 0,
    note: note || '',
    status: id ? 'confirmed' : 'unconfirmed'
  };

  if (!channelsData[category]) channelsData[category] = [];
  channelsData[category].push(newCh);
  renderAll();

  // 입력 초기화
  ['addName', 'addUrl', 'addId', 'addNote'].forEach(id => {
    document.getElementById(id).value = '';
  });

  showToast(`"${name}" 추가 완료! (GitHub 저장 필요)`, 'success');
  switchTab('tab-' + (category === 'broadcast' ? 'broadcast' : category));
}

// ===== 채널 검증 (YouTube API) =====
async function verifyChannel(category, idx) {
  if (!ytKey) {
    showToast('YouTube API Key가 없습니다.', 'error');
    return;
  }
  const ch = channelsData[category][idx];
  if (!ch.id) {
    showToast(`${ch.name}: 채널 ID가 없습니다.`, 'error');
    return;
  }

  showToast(`${ch.name} 검증 중...`, 'info');
  try {
    // 업로드 플레이리스트 가져오기
    const playlistId = 'UU' + ch.id.slice(2);
    const plRes = await fetch(
      `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=10&key=${ytKey}`
    );
    const plData = await plRes.json();
    const videoIds = (plData.items || [])
      .map(i => i.snippet?.resourceId?.videoId)
      .filter(Boolean);

    if (!videoIds.length) {
      showToast(`${ch.name}: 최근 영상 없음`, 'error');
      return;
    }

    // 조회수 확인
    const statsRes = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds.join(',')}&key=${ytKey}`
    );
    const statsData = await statsRes.json();
    const views = (statsData.items || [])
      .map(i => parseInt(i.statistics?.viewCount || '0'));
    const maxViews = Math.max(...views);

    if (maxViews >= MIN_VIEWS) {
      channelsData[category][idx].status = 'confirmed';
      showToast(`✅ ${ch.name}: 검증 성공 (최대 ${maxViews.toLocaleString()} 뷰)`, 'success');
    } else {
      showToast(`❌ ${ch.name}: 기준 미달 (최대 ${maxViews.toLocaleString()} 뷰 / 기준 ${MIN_VIEWS.toLocaleString()})`, 'error');
    }
    renderAll();
  } catch (e) {
    showToast(`검증 실패: ${e.message}`, 'error');
  }
}

// ===== 일괄 검증 =====
async function bulkVerify(category) {
  if (!ytKey) {
    showToast('YouTube API Key가 없습니다.', 'error');
    return;
  }
  const channels = channelsData[category] || [];
  const toVerify = channels.filter(c => c.id && c.status !== 'confirmed');
  if (!toVerify.length) {
    showToast('검증할 채널이 없습니다.', 'info');
    return;
  }
  showToast(`${toVerify.length}개 채널 일괄 검증 시작...`, 'info');
  for (let i = 0; i < channels.length; i++) {
    if (channels[i].id && channels[i].status !== 'confirmed') {
      await verifyChannel(category, i);
      await new Promise(r => setTimeout(r, 300)); // API 레이트 리밋 방지
    }
  }
  showToast('일괄 검증 완료!', 'success');
}

// ===== 일괄 승인 =====
function bulkApprove(category) {
  if (!confirm(`${category} 카테고리의 ID가 있는 모든 채널을 승인하시겠습니까?`)) return;
  const channels = channelsData[category] || [];
  let count = 0;
  channels.forEach(ch => {
    if (ch.id && ch.status !== 'confirmed') {
      ch.status = 'confirmed';
      count++;
    }
  });
  renderAll();
  showToast(`${count}개 채널 승인 완료 (GitHub 저장 필요)`, 'success');
}

// ===== GitHub 저장 =====
async function saveToGitHub() {
  if (!confirm('channels.json을 GitHub에 저장하시겠습니까?')) return;

  try {
    showToast('저장 중...', 'info');
    const file = await ghGet(CHANNELS_FILE);
    const sha = file.sha;

    // 메타 업데이트
    channelsData.meta = channelsData.meta || {};
    channelsData.meta.last_updated = new Date().toISOString().split('T')[0];

    const content = JSON.stringify(channelsData, null, 2);
    await ghPut(
      CHANNELS_FILE,
      content,
      sha,
      `admin: channels.json 업데이트 ${channelsData.meta.last_updated}`
    );
    showToast('✅ GitHub 저장 완료!', 'success');
  } catch (e) {
    showToast(`저장 실패: ${e.message}`, 'error');
    console.error(e);
  }
}

// ===== 월간 업데이트 =====
async function runMonthlyUpdate() {
  document.getElementById('updateModal').classList.remove('hidden');
  const logEl = document.getElementById('updateLog');
  const progressEl = document.getElementById('updateProgress');
  logEl.innerHTML = '';

  function log(msg) {
    logEl.innerHTML += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  log('🚀 월간 업데이트 시작...');

  try {
    // candidates.json 로드
    log('📥 candidates.json 로드 중...');
    let candidates = [];
    try {
      const file = await ghGet(CANDIDATES_FILE);
      const raw = decodeURIComponent(escape(atob(file.content)));
      candidates = JSON.parse(raw);
      log(`  → ${candidates.length}개 후보 채널 발견`);
    } catch (e) {
      log(`  ⚠️ candidates.json 없음 또는 로드 실패: ${e.message}`);
      log('  → 업데이트 없이 종료합니다.');
      return;
    }

    // 기존 채널 ID 목록
    const existingIds = new Set([
      ...( channelsData.broadcast || []).map(c => c.id),
      ...( channelsData.youtuber || []).map(c => c.id),
      ...( channelsData.securities || []).map(c => c.id),
    ].filter(Boolean));

    // 새 후보 필터링
    const newCandidates = candidates.filter(c => c.id && !existingIds.has(c.id));
    log(`  → 신규 후보: ${newCandidates.length}개`);

    if (!newCandidates.length) {
      log('✅ 추가할 새 채널이 없습니다.');
      return;
    }

    // YouTube API로 임계값 확인
    let added = 0;
    for (const candidate of newCandidates) {
      log(`\n🔍 검토: ${candidate.name} (${candidate.id})`);

      if (!ytKey) {
        log('  ⚠️ YouTube API Key 없음, 바로 추가');
        const category = candidate.category || 'youtuber';
        if (!channelsData[category]) channelsData[category] = [];
        channelsData[category].push({
          name: candidate.name,
          id: candidate.id,
          url: candidate.url || '',
          subscribers: candidate.subscribers || 0,
          note: candidate.note || '월간 업데이트 추가',
          status: 'candidate'
        });
        added++;
        continue;
      }

      try {
        // 업로드 플레이리스트로 최근 영상 조회
        const playlistId = 'UU' + candidate.id.slice(2);
        const plRes = await fetch(
          `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${encodeURIComponent(playlistId)}&maxResults=10&key=${ytKey}`
        );
        const plData = await plRes.json();
        const videoIds = (plData.items || [])
          .map(i => i.snippet?.resourceId?.videoId)
          .filter(Boolean);

        if (!videoIds.length) {
          log(`  ❌ 최근 영상 없음, 건너뜀`);
          continue;
        }

        const statsRes = await fetch(
          `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds.join(',')}&key=${ytKey}`
        );
        const statsData = await statsRes.json();
        const views = (statsData.items || [])
          .map(i => parseInt(i.statistics?.viewCount || '0'));
        const maxViews = Math.max(...views);

        log(`  → 최대 조회수: ${maxViews.toLocaleString()}`);

        if (maxViews >= MIN_VIEWS) {
          const category = candidate.category || 'youtuber';
          if (!channelsData[category]) channelsData[category] = [];
          channelsData[category].push({
            name: candidate.name,
            id: candidate.id,
            url: candidate.url || '',
            subscribers: candidate.subscribers || 0,
            note: candidate.note || '월간 업데이트 추가',
            status: 'confirmed'
          });
          log(`  ✅ 추가됨 (${category})`);
          added++;
        } else {
          log(`  ❌ 기준 미달 (${MIN_VIEWS.toLocaleString()} 뷰 기준)`);
        }

        await new Promise(r => setTimeout(r, 200));
      } catch (e) {
        log(`  ❌ 오류: ${e.message}`);
      }
    }

    log(`\n🎉 완료: ${added}개 채널 추가`);
    if (added > 0) {
      renderAll();
      log('💾 GitHub에 저장하려면 "GitHub 저장" 버튼을 클릭하세요.');
      showToast(`${added}개 채널 추가됨! GitHub 저장 필요`, 'success');
    }

  } catch (e) {
    log(`\n❌ 오류 발생: ${e.message}`);
    console.error(e);
  }
}

function closeUpdateModal() {
  document.getElementById('updateModal').classList.add('hidden');
}

// ===== Toast =====
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}
