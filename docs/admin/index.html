<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Briefing – 채널 관리자</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #4f8ef7;
      --accent2: #7c5cfc;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #e2e8f0;
      --muted: #8892aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px; width: 400px;
    }
    .login-box h2 { font-size: 1.4rem; margin-bottom: 24px; color: var(--accent); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 14px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: .95rem;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .btn-login {
      width: 100%; padding: 12px; background: var(--accent);
      border: none; border-radius: 8px; color: #fff;
      font-size: 1rem; cursor: pointer; font-weight: 600; margin-top: 8px;
    }
    .btn-login:hover { background: var(--accent2); }
    .login-error { color: var(--red); font-size: .85rem; margin-top: 10px; display: none; }

    /* ── Header ── */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 28px; height: 60px; display: flex; align-items: center; gap: 16px;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1.1rem; color: var(--accent); flex: 1; }
    .header-btns { display: flex; gap: 10px; align-items: center; }

    .btn {
      padding: 8px 18px; border-radius: 8px; border: none;
      font-size: .88rem; font-weight: 600; cursor: pointer; transition: .2s;
    }
    .btn-primary   { background: var(--accent);  color: #fff; }
    .btn-primary:hover   { background: var(--accent2); }
    .btn-success   { background: var(--green);   color: #fff; }
    .btn-success:hover   { opacity: .85; }
    .btn-danger    { background: var(--red);     color: #fff; }
    .btn-danger:hover    { opacity: .85; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-sm { padding: 5px 12px; font-size: .8rem; }

    /* Update 버튼 깜빡이기 */
    @keyframes blink {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(245,158,11,.7); }
      50%       { opacity: .5; box-shadow: 0 0 0 8px rgba(245,158,11,0); }
    }
    .btn-update-blink {
      background: var(--yellow) !important;
      animation: blink 1.2s infinite;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 4px; padding: 16px 28px 0;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 10px 20px; background: none; border: none;
      color: var(--muted); font-size: .9rem; cursor: pointer;
      border-bottom: 3px solid transparent; transition: .2s;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── Content ── */
    #main-content { padding: 24px 28px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 22px; flex: 1; min-width: 130px;
    }
    .stat-card .val { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { font-size: .78rem; color: var(--muted); margin-top: 2px; }

    /* ── Channel grid ── */
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .channel-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; transition: border-color .2s;
    }
    .channel-card:hover { border-color: var(--accent); }
    .channel-card.status-active   { border-left: 4px solid var(--green); }
    .channel-card.status-inactive { border-left: 4px solid var(--red); }
    .channel-card.status-pending  { border-left: 4px solid var(--yellow); }

    .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .card-rank   { font-size: .8rem; color: var(--muted); min-width: 28px; }
    .card-name   { font-weight: 600; font-size: .98rem; flex: 1; }
    .badge {
      font-size: .72rem; padding: 3px 9px; border-radius: 20px; font-weight: 600;
    }
    .badge-active   { background: #16532a; color: var(--green); }
    .badge-inactive { background: #450a0a; color: var(--red); }
    .badge-pending  { background: #451a03; color: var(--yellow); }
    .badge-verified { background: #1e3a5f; color: var(--accent); font-size: .7rem; padding: 2px 7px; }

    .card-meta { font-size: .82rem; color: var(--muted); margin-bottom: 10px; line-height: 1.6; }
    .card-meta span { display: inline-block; margin-right: 14px; }
    .card-note { font-size: .8rem; color: #6b7fa0; margin-bottom: 12px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── Add channel panel ── */
    .add-form {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 28px; max-width: 560px;
    }
    .add-form h3 { margin-bottom: 20px; color: var(--accent); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      display: none; align-items: center; justify-content: center; z-index: 500;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 32px; width: 520px; max-height: 85vh;
      overflow-y: auto;
    }
    .modal h3 { margin-bottom: 20px; color: var(--accent); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ── Toast ── */
    #toast-container {
      position: fixed; bottom: 28px; right: 28px;
      display: flex; flex-direction: column; gap: 10px; z-index: 9999;
    }
    .toast {
      padding: 12px 20px; border-radius: 10px; font-size: .9rem;
      color: #fff; max-width: 360px;
      animation: slideIn .3s ease;
    }
    .toast.success { background: #166534; }
    .toast.error   { background: #7f1d1d; }
    .toast.info    { background: #1e3a5f; }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Candidate diff panel ── */
    .diff-section { margin-bottom: 24px; }
    .diff-section h4 { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
    .diff-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
    }
    .diff-item .di-name { flex: 1; font-weight: 600; }
    .diff-item .di-subs { font-size: .82rem; color: var(--muted); }
    .diff-item .di-flag { font-size: .78rem; color: var(--red); }
  </style>
</head>
<body>

<!-- ===================== LOGIN OVERLAY ===================== -->
<div id="login-overlay">
  <div class="login-box">
    <h2>🔐 관리자 로그인</h2>
    <div class="form-group">
      <label>관리자 비밀번호</label>
      <input type="password" id="inp-password" placeholder="비밀번호 입력">
    </div>
    <div class="form-group">
      <label>GitHub Personal Access Token
        <span style="color:var(--muted);font-weight:400"> (repo 권한 필요)</span>
      </label>
      <input type="password" id="inp-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="form-group">
      <label>YouTube Data API Key
        <span style="color:var(--muted);font-weight:400"> (선택 – 채널 검증에 사용)</span>
      </label>
      <input type="text" id="inp-ytkey" placeholder="AIzaSy...">
    </div>
    <button class="btn-login" onclick="doLogin()">로그인</button>
    <div class="login-error" id="login-error">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- ===================== HEADER ===================== -->
<header>
  <h1>📊 Stock Briefing – 채널 관리</h1>
  <div class="header-btns">
    <button class="btn btn-primary" id="btn-update" onclick="runMonthlyUpdate()">
      📋 채널 목록 업데이트
    </button>
    <button class="btn btn-success" onclick="saveChannels()">💾 저장</button>
    <button class="btn btn-secondary btn-sm" onclick="doLogout()">로그아웃</button>
  </div>
</header>

<!-- ===================== TABS ===================== -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('general')">일반 유튜버 <span id="cnt-general"></span></button>
  <button class="tab-btn" onclick="switchTab('broadcast')">경제방송 <span id="cnt-broadcast"></span></button>
  <button class="tab-btn" onclick="switchTab('newspaper')">신문사 <span id="cnt-newspaper"></span></button>
  <button class="tab-btn" onclick="switchTab('securities')">증권사 <span id="cnt-securities"></span></button>
  <button class="tab-btn" onclick="switchTab('add')">➕ 채널 추가</button>
</div>

<!-- ===================== MAIN CONTENT ===================== -->
<div id="main-content">

  <!-- General -->
  <div class="tab-panel active" id="panel-general">
    <div class="stats-bar" id="stats-general"></div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn btn-secondary btn-sm" onclick="verifyAll('general')">🔍 전체 검증</button>
      <button class="btn btn-secondary btn-sm" onclick="approveAll('general')">✅ 전체 승인</button>
    </div>
    <div class="channel-grid" id="grid-general"></div>
  </div>

  <!-- Broadcast -->
  <div class="tab-panel" id="panel-broadcast">
    <div class="stats-bar" id="stats-broadcast"></div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn btn-secondary btn-sm" onclick="verifyAll('broadcast')">🔍 전체 검증</button>
      <button class="btn btn-secondary btn-sm" onclick="approveAll('broadcast')">✅ 전체 승인</button>
    </div>
    <div class="channel-grid" id="grid-broadcast"></div>
  </div>

  <!-- Newspaper -->
  <div class="tab-panel" id="panel-newspaper">
    <div class="stats-bar" id="stats-newspaper"></div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn btn-secondary btn-sm" onclick="verifyAll('newspaper')">🔍 전체 검증</button>
      <button class="btn btn-secondary btn-sm" onclick="approveAll('newspaper')">✅ 전체 승인</button>
    </div>
    <div class="channel-grid" id="grid-newspaper"></div>
  </div>

  <!-- Securities -->
  <div class="tab-panel" id="panel-securities">
    <div class="stats-bar" id="stats-securities"></div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn btn-secondary btn-sm" onclick="verifyAll('securities')">🔍 전체 검증</button>
      <button class="btn btn-secondary btn-sm" onclick="approveAll('securities')">✅ 전체 승인</button>
    </div>
    <div class="channel-grid" id="grid-securities"></div>
  </div>

  <!-- Add -->
  <div class="tab-panel" id="panel-add">
    <div class="add-form">
      <h3>채널 직접 추가</h3>
      <div class="form-group">
        <label>유형</label>
        <select id="add-type" style="width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
          <option value="general">일반 유튜버</option>
          <option value="broadcast">경제방송</option>
          <option value="newspaper">신문사</option>
          <option value="securities">증권사</option>
        </select>
      </div>
      <div class="form-group">
        <label>채널 URL 또는 @핸들</label>
        <input type="text" id="add-url" placeholder="https://www.youtube.com/@example 또는 @example">
      </div>
      <div class="form-group">
        <label>채널명</label>
        <input type="text" id="add-name" placeholder="채널명">
      </div>
      <div class="form-group">
        <label>메모 (선택)</label>
        <input type="text" id="add-note" placeholder="예: 미국주식 전문">
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn btn-primary" onclick="fetchAndAddChannel()">🔍 API 조회 후 추가</button>
        <button class="btn btn-secondary" onclick="manualAddChannel()">수동 추가</button>
      </div>
    </div>
  </div>

</div>

<!-- ===================== EDIT MODAL ===================== -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>채널 편집</h3>
    <input type="hidden" id="edit-section">
    <input type="hidden" id="edit-index">
    <div class="form-group"><label>채널명</label><input type="text" id="edit-name"></div>
    <div class="form-group"><label>채널 ID</label><input type="text" id="edit-id" placeholder="UCxxxxxxxx"></div>
    <div class="form-group"><label>URL</label><input type="text" id="edit-url"></div>
    <div class="form-group"><label>구독자 수</label><input type="number" id="edit-subs"></div>
    <div class="form-group"><label>메모</label><input type="text" id="edit-note"></div>
    <div class="form-group">
      <label>상태</label>
      <select id="edit-status" style="width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text)">
        <option value="pending">pending</option>
        <option value="active">active</option>
        <option value="inactive">inactive</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditModal()">취소</button>
      <button class="btn btn-success" onclick="saveEditModal()">저장</button>
    </div>
  </div>
</div>

<!-- ===================== UPDATE MODAL ===================== -->
<div class="modal-overlay" id="update-modal">
  <div class="modal" style="width:680px">
    <h3>📋 채널 목록 업데이트</h3>
    <p style="color:var(--muted);font-size:.88rem;margin-bottom:20px">
      외부 후보 목록과 비교하고, YouTube API로 기존 채널을 재검증합니다.
    </p>
    <div id="update-content"><div class="spinner"></div> 로딩 중...</div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeUpdateModal()">닫기</button>
      <button class="btn btn-success" id="btn-apply-update" style="display:none" onclick="applyUpdate()">적용 후 저장</button>
    </div>
  </div>
</div>

<!-- ===================== TOAST ===================== -->
<div id="toast-container"></div>

<!-- ===================== SCRIPT ===================== -->
<script>
/* ── Constants ── */
const REPO           = 'kunil-choi/stock-briefing-v3';
const CHANNELS_FILE  = 'channels.json';
const CANDIDATES_FILE= 'data/channel_candidates.json';
const ADMIN_PASSWORD = 'stock2026!';
const MIN_VIEWS      = 10000;

/* ── State ── */
let githubToken = '';
let ytApiKey    = '';
let channelsData = null;
let channelsSha  = '';
let updateBtnBlinked = false;

/* ── Login / Logout ── */
function doLogin() {
  const pw    = document.getElementById('inp-password').value;
  const token = document.getElementById('inp-token').value.trim();
  const ytkey = document.getElementById('inp-ytkey').value.trim();

  if (pw !== ADMIN_PASSWORD) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  if (!token) { alert('GitHub Token을 입력해주세요.'); return; }

  githubToken = token;
  ytApiKey    = ytkey;
  document.getElementById('login-overlay').style.display = 'none';
  loadChannels();
  checkMonthlyBlinkState();
}

function doLogout() {
  githubToken = '';
  channelsData = null;
  document.getElementById('login-overlay').style.display = 'flex';
}

/* ── Monthly blink logic ── */
function checkMonthlyBlinkState() {
  const today     = new Date();
  const storageKey= `update_done_${today.getFullYear()}_${today.getMonth()+1}`;
  const done      = localStorage.getItem(storageKey);
  const isFirst   = today.getDate() === 1;

  if (isFirst && !done) {
    document.getElementById('btn-update').classList.add('btn-update-blink');
    updateBtnBlinked = true;
  }
}

function markUpdateDone() {
  const today     = new Date();
  const storageKey= `update_done_${today.getFullYear()}_${today.getMonth()+1}`;
  localStorage.setItem(storageKey, 'true');
  document.getElementById('btn-update').classList.remove('btn-update-blink');
}

/* ── GitHub API ── */
async function ghGet(path) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    headers: { Authorization: `token ${githubToken}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error(`GitHub GET 실패: ${res.status}`);
  return res.json();
}

async function ghPut(path, content, sha, message) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${githubToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message, content: btoa(unescape(encodeURIComponent(content))), sha
    })
  });
  if (!res.ok) throw new Error(`GitHub PUT 실패: ${res.status}`);
  return res.json();
}

/* ── Load channels.json ── */
async function loadChannels() {
  try {
    showToast('channels.json 로딩 중...', 'info');
    const file = await ghGet(CHANNELS_FILE);
    channelsSha  = file.sha;
    channelsData = JSON.parse(decodeURIComponent(escape(atob(file.content))));
    renderAll();
    showToast('채널 데이터 로드 완료', 'success');
  } catch(e) {
    showToast('로드 실패: ' + e.message, 'error');
  }
}

/* ── Render ── */
function renderAll() {
  renderSection('general',   channelsData.general_youtubers);
  renderSection('broadcast', channelsData.media_channels.broadcast);
  renderSection('newspaper', channelsData.media_channels.newspaper);
  renderSection('securities',channelsData.media_channels.securities);
}

function renderSection(section, list) {
  const grid  = document.getElementById('grid-'+section);
  const stats = document.getElementById('stats-'+section);
  const cnt   = document.getElementById('cnt-'+section);
  if (!grid || !list) return;

  const active   = list.filter(c=>c.status==='active').length;
  const inactive = list.filter(c=>c.status==='inactive').length;
  const pending  = list.filter(c=>c.status==='pending').length;

  cnt.textContent   = `(${list.length})`;
  stats.innerHTML   = `
    <div class="stat-card"><div class="val">${list.length}</div><div class="lbl">전체 채널</div></div>
    <div class="stat-card"><div class="val" style="color:var(--green)">${active}</div><div class="lbl">활성</div></div>
    <div class="stat-card"><div class="val" style="color:var(--yellow)">${pending}</div><div class="lbl">검토중</div></div>
    <div class="stat-card"><div class="val" style="color:var(--red)">${inactive}</div><div class="lbl">비활성</div></div>
  `;

  grid.innerHTML = list.map((ch, i) => `
    <div class="channel-card status-${ch.status}">
      <div class="card-header">
        ${ch.rank ? `<span class="card-rank">#${ch.rank}</span>` : ''}
        <span class="card-name">${ch.name}</span>
        <span class="badge badge-${ch.status}">${statusLabel(ch.status)}</span>
        ${ch.id_confirmed ? '<span class="badge badge-verified">ID✓</span>' : ''}
      </div>
      <div class="card-meta">
        <span>👥 ${fmtSubs(ch.subscribers)}</span>
        ${ch.max_views ? `<span>👁️ ${fmtSubs(ch.max_views)}</span>` : ''}
        ${ch.verified_at ? `<span style="font-size:.75rem">검증: ${ch.verified_at}</span>` : ''}
      </div>
      ${ch.note ? `<div class="card-note">📝 ${ch.note}</div>` : ''}
      <div class="card-actions">
        ${ch.status !== 'active'   ? `<button class="btn btn-success btn-sm" onclick="setStatus('${section}',${i},'active')">✅ 승인</button>` : ''}
        ${ch.status !== 'inactive' ? `<button class="btn btn-danger btn-sm"  onclick="setStatus('${section}',${i},'inactive')">🚫 비활성</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="verifyChannel('${section}',${i})">🔍 검증</button>
        <button class="btn btn-secondary btn-sm" onclick="openEditModal('${section}',${i})">✏️ 편집</button>
        <button class="btn btn-danger btn-sm"    onclick="removeChannel('${section}',${i})">🗑️</button>
      </div>
    </div>
  `).join('');
}

function statusLabel(s) {
  return s==='active' ? '활성' : s==='inactive' ? '비활성' : '검토중';
}
function fmtSubs(n) {
  if (!n) return '-';
  if (n>=1000000) return (n/1000000).toFixed(1)+'M';
  if (n>=1000)    return (n/1000).toFixed(0)+'K';
  return n;
}

/* ── Get / set list reference ── */
function getList(section) {
  if (section==='general')    return channelsData.general_youtubers;
  if (section==='broadcast')  return channelsData.media_channels.broadcast;
  if (section==='newspaper')  return channelsData.media_channels.newspaper;
  if (section==='securities') return channelsData.media_channels.securities;
  return [];
}

/* ── Status actions ── */
function setStatus(section, i, status) {
  getList(section)[i].status = status;
  renderAll();
}
function approveAll(section) {
  getList(section).forEach(ch => { if(ch.status==='pending') ch.status='active'; });
  renderAll();
  showToast('전체 승인 완료 (pending → active)', 'success');
}
function removeChannel(section, i) {
  if (!confirm('채널을 삭제하시겠습니까?')) return;
  getList(section).splice(i, 1);
  renderAll();
  showToast('채널 삭제됨', 'info');
}

/* ── YouTube API verification ── */
async function verifyChannel(section, i) {
  const ch = getList(section)[i];
  if (!ch.id) { showToast(`${ch.name}: 채널 ID가 없어 검증 불가`, 'error'); return; }
  if (!ytApiKey) { showToast('YouTube API Key가 없습니다.', 'error'); return; }

  showToast(`${ch.name} 검증 중...`, 'info');
  try {
    // 구독자 수
    const chRes  = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${ch.id}&key=${ytApiKey}`);
    const chData = await chRes.json();
    const stats  = chData.items?.[0]?.statistics;
    if (stats) {
      ch.subscribers    = parseInt(stats.subscriberCount)||ch.subscribers;
      ch.id_confirmed   = true;
    }

    // 최근 영상 최고 조회수
    const vidRes  = await fetch(`https://www.googleapis.com/youtube/v3/search?part=id&channelId=${ch.id}&order=date&maxResults=10&type=video&key=${ytApiKey}`);
    const vidData = await vidRes.json();
    const vids    = (vidData.items||[]).map(v=>v.id.videoId).filter(Boolean);

    if (vids.length > 0) {
      const statsRes  = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${vids.join(',')}&key=${ytApiKey}`);
      const statsData = await statsRes.json();
      const views     = (statsData.items||[]).map(v=>parseInt(v.statistics?.viewCount||0));
      ch.max_views    = Math.max(...views);
      if (ch.max_views < MIN_VIEWS) {
        ch.status = 'inactive';
        showToast(`${ch.name}: 최고 조회수 ${fmtSubs(ch.max_views)} → 비활성 처리`, 'error');
      } else {
        showToast(`${ch.name}: 검증 완료 ✅ (최고조회수: ${fmtSubs(ch.max_views)})`, 'success');
      }
    }
    ch.verified_at = new Date().toISOString().split('T')[0];
    renderAll();
  } catch(e) {
    showToast(`검증 오류: ${e.message}`, 'error');
  }
}

async function verifyAll(section) {
  const list = getList(section);
  showToast(`${list.length}개 채널 순차 검증 시작...`, 'info');
  for (let i=0; i<list.length; i++) {
    if (list[i].id) await verifyChannel(section, i);
  }
  showToast('전체 검증 완료', 'success');
}

/* ── Add channel ── */
async function fetchAndAddChannel() {
  const url   = document.getElementById('add-url').value.trim();
  const name  = document.getElementById('add-name').value.trim();
  const note  = document.getElementById('add-note').value.trim();
  const type  = document.getElementById('add-type').value;
  if (!url || !name) { showToast('URL과 채널명을 입력하세요.', 'error'); return; }

  const handle = url.replace(/.*@/, '@').replace(/\/$/, '');
  let channelId = '';

  if (ytApiKey) {
    try {
      showToast('채널 정보 조회 중...', 'info');
      const res  = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id,statistics&forHandle=${encodeURIComponent(handle.replace('@',''))}&key=${ytApiKey}`);
      const data = await res.json();
      const item = data.items?.[0];
      if (item) {
        channelId = item.id;
        const subs = parseInt(item.statistics?.subscriberCount||0);
        addToList(type, { name, id: channelId, id_confirmed: true, url, subscribers: subs, status: 'pending', note });
        showToast(`${name} 추가 완료 (구독자: ${fmtSubs(subs)})`, 'success');
        return;
      }
    } catch(e) { /* fallthrough */ }
  }
  addToList(type, { name, id: '', id_confirmed: false, url, subscribers: 0, status: 'pending', note });
  showToast(`${name} 수동 추가됨 (API 조회 실패)`, 'info');
}

function manualAddChannel() {
  const url  = document.getElementById('add-url').value.trim();
  const name = document.getElementById('add-name').value.trim();
  const note = document.getElementById('add-note').value.trim();
  const type = document.getElementById('add-type').value;
  if (!name) { showToast('채널명을 입력하세요.', 'error'); return; }
  addToList(type, { name, id: '', id_confirmed: false, url, subscribers: 0, status: 'pending', note });
  showToast(`${name} 추가됨`, 'success');
}

function addToList(type, ch) {
  getList(type).push(ch);
  renderAll();
  document.getElementById('add-url').value  = '';
  document.getElementById('add-name').value = '';
  document.getElementById('add-note').value = '';
}

/* ── Edit modal ── */
function openEditModal(section, i) {
  const ch = getList(section)[i];
  document.getElementById('edit-section').value = section;
  document.getElementById('edit-index').value   = i;
  document.getElementById('edit-name').value    = ch.name;
  document.getElementById('edit-id').value      = ch.id||'';
  document.getElementById('edit-url').value     = ch.url||'';
  document.getElementById('edit-subs').value    = ch.subscribers||0;
  document.getElementById('edit-note').value    = ch.note||'';
  document.getElementById('edit-status').value  = ch.status;
  document.getElementById('edit-modal').classList.add('open');
}
function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
}
function saveEditModal() {
  const section = document.getElementById('edit-section').value;
  const i       = parseInt(document.getElementById('edit-index').value);
  const ch      = getList(section)[i];
  ch.name        = document.getElementById('edit-name').value;
  ch.id          = document.getElementById('edit-id').value;
  ch.id_confirmed= !!ch.id;
  ch.url         = document.getElementById('edit-url').value;
  ch.subscribers = parseInt(document.getElementById('edit-subs').value)||0;
  ch.note        = document.getElementById('edit-note').value;
  ch.status      = document.getElementById('edit-status').value;
  closeEditModal();
  renderAll();
  showToast('편집 저장됨', 'success');
}

/* ── Save to GitHub ── */
async function saveChannels() {
  if (!channelsData) { showToast('데이터가 없습니다.', 'error'); return; }
  try {
    showToast('저장 중...', 'info');
    channelsData.meta.last_updated = new Date().toISOString().split('T')[0];
    const content  = JSON.stringify(channelsData, null, 2);
    const result   = await ghPut(CHANNELS_FILE, content, channelsSha, `admin: update channels.json ${channelsData.meta.last_updated}`);
    channelsSha    = result.content.sha;
    showToast('channels.json 저장 완료 ✅', 'success');
  } catch(e) {
    showToast('저장 실패: ' + e.message, 'error');
  }
}

/* ── Monthly update modal ── */
async function runMonthlyUpdate() {
  document.getElementById('update-modal').classList.add('open');
  document.getElementById('update-content').innerHTML = '<div class="spinner"></div> 후보 파일 및 채널 재검증 중...';
  document.getElementById('btn-apply-update').style.display = 'none';

  let candidates = [];
  try {
    const file = await ghGet(CANDIDATES_FILE);
    candidates  = JSON.parse(decodeURIComponent(escape(atob(file.content))));
  } catch(e) {
    candidates  = [];
  }

  // 현재 채널 ID 목록
  const allIds = new Set([
    ...channelsData.general_youtubers,
    ...channelsData.media_channels.broadcast,
    ...channelsData.media_channels.newspaper,
    ...channelsData.media_channels.securities,
  ].map(c=>c.id).filter(Boolean));

  const newCandidates = candidates.filter(c => c.id && !allIds.has(c.id));

  // 기존 채널 중 구독자 미달 (API 없으면 표시만)
  let belowThreshold = [];
  if (ytApiKey) {
    const allChannels = [
      ...channelsData.general_youtubers.map(c=>({...c,_section:'general'})),
      ...channelsData.media_channels.broadcast.map(c=>({...c,_section:'broadcast'})),
      ...channelsData.media_channels.newspaper.map(c=>({...c,_section:'newspaper'})),
      ...channelsData.media_channels.securities.map(c=>({...c,_section:'securities'})),
    ].filter(c=>c.id);

    for (const ch of allChannels.slice(0,10)) { // 과금 방지: 처음 10개만 샘플
      try {
        const r = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${ch.id}&key=${ytApiKey}`);
        const d = await r.json();
        const s = d.items?.[0]?.statistics;
        if (s && parseInt(s.subscriberCount||0) < 10000) belowThreshold.push(ch);
      } catch(e) { /* skip */ }
    }
  }

  let html = '';

  if (newCandidates.length > 0) {
    html += `<div class="diff-section"><h4>🆕 신규 후보 채널 (${newCandidates.length}개)</h4>`;
    html += newCandidates.map(c=>`
      <div class="diff-item">
        <span class="di-name">${c.name}</span>
        <span class="di-subs">👥 ${fmtSubs(c.subscribers)}</span>
        <span class="badge badge-pending">신규</span>
      </div>`).join('');
    html += '</div>';
  } else {
    html += `<div class="diff-section"><p style="color:var(--muted)">신규 후보 채널 없음 (candidates 파일 비어있거나 모두 등록됨)</p></div>`;
  }

  if (belowThreshold.length > 0) {
    html += `<div class="diff-section"><h4>⚠️ 조회수 미달 채널</h4>`;
    html += belowThreshold.map(c=>`
      <div class="diff-item">
        <span class="di-name">${c.name}</span>
        <span class="di-subs">👥 ${fmtSubs(c.subscribers)}</span>
        <span class="di-flag">기준 미달 → 비활성 권고</span>
      </div>`).join('');
    html += '</div>';
  }

  if (newCandidates.length === 0 && belowThreshold.length === 0 && !ytApiKey) {
    html += `<p style="color:var(--muted)">YouTube API Key가 없어 검증이 제한됩니다. 로그인 시 API Key를 입력하면 자동 검증이 가능합니다.</p>`;
  }

  document.getElementById('update-content').innerHTML = html;
  document.getElementById('btn-apply-update').style.display = 'inline-block';

  // 적용할 데이터 임시 저장
  window._pendingCandidates    = newCandidates;
  window._pendingBelowThreshold= belowThreshold;
}

function applyUpdate() {
  const newCandidates = window._pendingCandidates || [];
  newCandidates.forEach(c => {
    channelsData.general_youtubers.push({ ...c, status: 'pending' });
  });

  const belowThreshold = window._pendingBelowThreshold || [];
  ['general','broadcast','newspaper','securities'].forEach(section => {
    getList(section).forEach(ch => {
      if (belowThreshold.find(b=>b.id===ch.id)) ch.status = 'inactive';
    });
  });

  renderAll();
  markUpdateDone();
  closeUpdateModal();
  showToast(`업데이트 적용 완료 (신규 ${newCandidates.length}개 추가)`, 'success');
}

function closeUpdateModal() {
  document.getElementById('update-modal').classList.remove('open');
}

/* ── Tabs ── */
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  event.target.classList.add('active');
}

/* ── Toast ── */
function showToast(msg, type='info') {
  const c    = document.getElementById('toast-container');
  const div  = document.createElement('div');
  div.className = `toast ${type}`;
  div.textContent= msg;
  c.appendChild(div);
  setTimeout(()=>div.remove(), 3500);
}
</script>
