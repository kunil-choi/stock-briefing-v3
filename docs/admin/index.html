<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머니올라 브리핑 관리자</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
  --border: #30363d; --text: #e6edf3; --muted: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149;
  --orange: #d29922; --purple: #bc8cff;
}
body { background: var(--bg); color: var(--text);
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  line-height: 1.6; padding-bottom: 4rem; }
.header { background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 1.1rem; font-weight: 700; }
.header .subtitle { font-size: .78rem; color: var(--muted); margin-top: .1rem; }
#login-form { max-width: 360px; margin: 6rem auto; padding: 2rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
#login-form h2 { font-size: 1.1rem; margin-bottom: 1.2rem; text-align: center; }
#login-form input { width: 100%; padding: .6rem .9rem; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-size: .9rem; margin-bottom: .8rem; }
#login-form button { width: 100%; padding: .65rem; background: var(--accent);
  border: none; border-radius: 6px; color: #000; font-weight: 700;
  font-size: .95rem; cursor: pointer; }
.container { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem; }
.tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.tab { padding: .5rem 1.1rem; font-size: .88rem; font-weight: 600;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all .15s; background: none; border-top: none;
  border-left: none; border-right: none; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.section-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem;
  display: flex; align-items: center; gap: .5rem; }
.badge { font-size: .72rem; padding: .15rem .5rem; border-radius: 20px;
  font-weight: 700; }
.badge-orange { background: #d2992222; color: var(--orange); border: 1px solid #d2992244; }
.badge-green  { background: #3fb95022; color: var(--green);  border: 1px solid #3fb95044; }
.badge-red    { background: #f8514922; color: var(--red);    border: 1px solid #f8514944; }
.badge-blue   { background: #58a6ff22; color: var(--accent); border: 1px solid #58a6ff44; }
.card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: .75rem; overflow: hidden; }
.card-header { padding: .75rem 1rem; background: var(--surface2);
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.card-body { padding: .75rem 1rem; }
.card-name { font-size: 1rem; font-weight: 700; flex: 1; }
.card-meta { font-size: .78rem; color: var(--muted); }
.sample-list { list-style: none; padding: 0; margin: .4rem 0; }
.sample-list li { font-size: .8rem; color: var(--muted); padding: .2rem 0;
  border-bottom: 1px solid var(--border); }
.sample-list li:last-child { border: none; }
.btn-row { display: flex; gap: .5rem; margin-top: .75rem; }
.btn { padding: .4rem .9rem; border-radius: 6px; font-size: .82rem;
  font-weight: 700; cursor: pointer; border: none; transition: opacity .15s; }
.btn:hover { opacity: .8; }
.btn-approve { background: var(--green); color: #000; }
.btn-reject  { background: var(--surface2); color: var(--red);
  border: 1px solid var(--red); }
.btn-sm { padding: .25rem .6rem; font-size: .75rem; }
.cat-select { padding: .3rem .5rem; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 5px; color: var(--text);
  font-size: .82rem; }
.channel-id-input { padding: .3rem .5rem; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 5px; color: var(--text);
  font-size: .82rem; width: 200px; }
.registered-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
.registered-table th { background: var(--surface2); padding: .5rem .75rem;
  text-align: left; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--border); }
.registered-table td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); }
.registered-table tr:last-child td { border: none; }
.expert-tag { display: inline-block; background: var(--purple); color: #000;
  font-size: .7rem; padding: .1rem .4rem; border-radius: 3px;
  font-weight: 700; margin: .1rem; }
.count-badge { background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; font-size: .72rem; padding: .1rem .45rem; color: var(--muted); }
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: .75rem 1.2rem; font-size: .88rem; z-index: 999;
  transform: translateY(100px); transition: transform .3s; }
.toast.show { transform: translateY(0); }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error   { border-color: var(--red); color: var(--red); }
.empty { text-align: center; padding: 2.5rem; color: var(--muted); font-size: .9rem; }
.loading { text-align: center; padding: 2rem; color: var(--muted); }
.spinner { display: inline-block; width: 20px; height: 20px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; margin-right: .5rem; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-form">
    <h2>🔐 관리자 로그인</h2>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">로그인</button>
    <p id="login-err" style="color:var(--red);font-size:.8rem;margin-top:.5rem;text-align:center;"></p>
  </div>
</div>

<div id="main-screen" style="display:none;">
  <div class="header">
    <div>
      <div class="header h1" style="font-size:1.1rem;font-weight:700;">🛠 브리핑 관리자</div>
      <div class="subtitle" id="header-time"></div>
    </div>
    <button class="btn btn-sm" style="background:var(--surface2);color:var(--muted);" onclick="logout()">로그아웃</button>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('panelist')">👤 패널리스트 후보 <span id="panelist-cnt" class="count-badge">-</span></button>
      <button class="tab" onclick="switchTab('channel')">📺 채널 후보 <span id="channel-cnt" class="count-badge">-</span></button>
      <button class="tab" onclick="switchTab('registered')">✅ 등록 현황</button>
      <button class="tab" onclick="switchTab('add')">➕ 직접 추가</button>
    </div>

    <!-- 패널리스트 후보 탭 -->
    <div id="tab-panelist" class="tab-content active">
      <div class="section-title">
        👤 패널리스트 후보
        <span class="badge badge-orange">승인 시 POPULAR_PANELISTS 자동 추가</span>
      </div>
      <div id="panelist-list"><div class="loading"><span class="spinner"></span>로딩 중...</div></div>
    </div>

    <!-- 채널 후보 탭 -->
    <div id="tab-channel" class="tab-content">
      <div class="section-title">
        📺 채널 후보
        <span class="badge badge-blue">승인 시 channels.json 자동 추가</span>
      </div>
      <div id="channel-list"><div class="loading"><span class="spinner"></span>로딩 중...</div></div>
    </div>

    <!-- 등록 현황 탭 -->
    <div id="tab-registered" class="tab-content">
      <div class="section-title">✅ 현재 등록된 패널리스트 & 채널</div>
      <div id="registered-content"><div class="loading"><span class="spinner"></span>로딩 중...</div></div>
    </div>

    <!-- 직접 추가 탭 -->
    <div id="tab-add" class="tab-content">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">

        <!-- 패널리스트 직접 추가 -->
        <div class="card" style="padding:1.2rem;">
          <div class="section-title" style="margin-bottom:1rem;">👤 패널리스트 직접 추가</div>
          <div style="margin-bottom:.75rem;">
            <label style="font-size:.82rem;color:var(--muted);display:block;margin-bottom:.3rem;">이름</label>
            <input id="add-panelist-name" type="text" placeholder="예: 홍길동"
              style="width:100%;padding:.55rem .8rem;background:var(--surface2);
              border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;">
          </div>
          <button class="btn btn-approve" style="width:100%;" onclick="addPanelist()">✅ 패널리스트 추가</button>
          <p style="font-size:.75rem;color:var(--muted);margin-top:.6rem;">
            POPULAR_PANELISTS 목록에 즉시 추가됩니다.
          </p>
        </div>

        <!-- 채널 직접 추가 -->
        <div class="card" style="padding:1.2rem;">
          <div class="section-title" style="margin-bottom:1rem;">📺 채널 직접 추가</div>
          <div style="margin-bottom:.6rem;">
            <label style="font-size:.82rem;color:var(--muted);display:block;margin-bottom:.3rem;">채널명</label>
            <input id="add-ch-name" type="text" placeholder="예: 달란트투자"
              style="width:100%;padding:.55rem .8rem;background:var(--surface2);
              border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;">
          </div>
          <div style="margin-bottom:.6rem;">
            <label style="font-size:.82rem;color:var(--muted);display:block;margin-bottom:.3rem;">
              채널 ID
              <span style="color:var(--accent);font-weight:400;">
                (YouTube 채널 페이지 URL의 UC로 시작하는 값)
              </span>
            </label>
            <input id="add-ch-id" type="text" placeholder="예: UCxxxxxxxxxxxxxxxxxxxxxx"
              style="width:100%;padding:.55rem .8rem;background:var(--surface2);
              border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;">
          </div>
          <div style="margin-bottom:.75rem;">
            <label style="font-size:.82rem;color:var(--muted);display:block;margin-bottom:.3rem;">카테고리</label>
            <select id="add-ch-cat"
              style="width:100%;padding:.55rem .8rem;background:var(--surface2);
              border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9rem;">
              <option value="youtuber">유튜버</option>
              <option value="broadcast">경제방송</option>
              <option value="securities">증권사</option>
            </select>
          </div>
          <button class="btn btn-approve" style="width:100%;" onclick="addChannel()">✅ 채널 추가</button>
          <p style="font-size:.75rem;color:var(--muted);margin-top:.6rem;">
            channels.json에 즉시 추가됩니다.
          </p>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const REPO   = "kunil-choi/stock-briefing-v3";
const BRANCH = "main";
let GH_TOKEN = "";

// ── 인증 ──────────────────────────────────────────────────────────
const PW_HASH = "stock2026!";
function login() {
  const pw = document.getElementById("pw-input").value;
  if (pw !== PW_HASH) {
    document.getElementById("login-err").textContent = "비밀번호가 틀렸습니다.";
    return;
  }
  // GitHub Token은 환경변수로 관리 — 관리자가 직접 입력
  GH_TOKEN = prompt("GitHub Personal Access Token 입력 (repo 권한 필요):");
  if (!GH_TOKEN) { document.getElementById("login-err").textContent = "토큰이 필요합니다."; return; }
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("main-screen").style.display = "block";
  document.getElementById("header-time").textContent =
    new Date().toLocaleString("ko-KR", {timeZone:"Asia/Seoul"}) + " KST";
  loadAll();
}
function logout() {
  GH_TOKEN = "";
  location.reload();
}

// ── 직접 추가 ─────────────────────────────────────────────────────
async function addPanelist() {
  const name = document.getElementById("add-panelist-name").value.trim();
  if (!name) { showToast("이름을 입력하세요", "error"); return; }
  try {
    const cfg = await ghGet("config.py");
    let cfgContent = decodeURIComponent(escape(atob(cfg.content)));
    if (cfgContent.includes(`"${name}"`)) {
      showToast(`${name} 이미 등록됨`, "error"); return;
    }
    cfgContent = cfgContent.replace(
      `    "김학균", "김한진",\n]`,
      `    "김학균", "김한진",\n    "${name}",\n]`
    );
    await ghUpdate("config.py", cfgContent, cfg.sha, `feat: 패널리스트 직접 추가 — ${name}`);
    document.getElementById("add-panelist-name").value = "";
    showToast(`✅ ${name} 패널리스트 추가 완료`);
    await loadRegistered();
  } catch(e) { showToast(`오류: ${e.message}`, "error"); }
}

async function addChannel() {
  const chName = document.getElementById("add-ch-name").value.trim();
  const chId   = document.getElementById("add-ch-id").value.trim();
  const cat    = document.getElementById("add-ch-cat").value;
  if (!chName) { showToast("채널명을 입력하세요", "error"); return; }
  if (!chId || !chId.startsWith("UC")) {
    showToast("채널 ID를 확인하세요 (UC로 시작)", "error"); return;
  }
  try {
    const cj = await ghGet("channels.json");
    let channels = JSON.parse(decodeURIComponent(escape(atob(cj.content))));
    // 중복 확인
    for (const c of Object.values(channels).flat()) {
      if (typeof c === "object" && c.id === chId) {
        showToast("이미 등록된 채널 ID", "error"); return;
      }
    }
    channels[cat] = channels[cat] || [];
    channels[cat].push({ id: chId, name: chName });
    await ghUpdate("channels.json", JSON.stringify(channels, null, 2), cj.sha,
      `feat: 채널 직접 추가 — ${chName} (${cat})`);
    document.getElementById("add-ch-name").value = "";
    document.getElementById("add-ch-id").value   = "";
    showToast(`✅ ${chName} 채널 추가 완료 (${cat})`);
    await loadRegistered();
  } catch(e) { showToast(`오류: ${e.message}`, "error"); }
}

// ── GitHub API ────────────────────────────────────────────────────
async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
    headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json" }
  });
  if (!r.ok) throw new Error(`GET ${path} → ${r.status}`);
  return r.json();
}
async function ghUpdate(path, content, sha, message) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    method: "PUT",
    headers: { Authorization: `token ${GH_TOKEN}`, Accept: "application/vnd.github.v3+json",
               "Content-Type": "application/json" },
    body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha, branch: BRANCH })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message); }
  return r.json();
}
async function readJson(path) {
  try {
    const d = await ghGet(path);
    return { data: JSON.parse(decodeURIComponent(escape(atob(d.content)))), sha: d.sha };
  } catch(e) { return { data: [], sha: null }; }
}

// ── 토스트 ────────────────────────────────────────────────────────
function showToast(msg, type="success") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = "toast", 2500);
}

// ── 탭 전환 ──────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("active", ["panelist","channel","registered","add"][i]===name));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
}

// ── 데이터 로드 ──────────────────────────────────────────────────
async function loadAll() {
  await Promise.all([loadPanelists(), loadChannels(), loadRegistered()]);
}

// ── 패널리스트 후보 ───────────────────────────────────────────────
async function loadPanelists() {
  const el = document.getElementById("panelist-list");
  const { data, sha } = await readJson("data/pending_names.json");
  const pending = data.filter(d => d.status === "pending")
                      .sort((a,b) => b.count - a.count);
  document.getElementById("panelist-cnt").textContent = pending.length;
  if (!pending.length) { el.innerHTML = `<div class="empty">⭕ 승인 대기 중인 패널리스트 후보가 없습니다.</div>`; return; }
  el.innerHTML = pending.map(p => `
    <div class="card" id="pn-${p.name}">
      <div class="card-header">
        <span class="card-name">👤 ${p.name}</span>
        <span class="badge badge-orange">발견 ${p.count}회</span>
        <span class="card-meta">${p.first_seen} 첫 발견 · 최근 ${p.last_seen}</span>
      </div>
      <div class="card-body">
        <div style="font-size:.8rem;color:var(--muted);margin-bottom:.5rem;">등장 영상:</div>
        <ul class="sample-list">
          ${(p.sample_videos||[]).map(v=>`<li>▸ ${v}</li>`).join("")}
        </ul>
        <div class="btn-row">
          <button class="btn btn-approve btn-sm" onclick="approvePanelist('${p.name}')">✅ 승인</button>
          <button class="btn btn-reject btn-sm"  onclick="rejectPanelist('${p.name}')">❌ 거절</button>
        </div>
      </div>
    </div>`).join("");
}

async function approvePanelist(name) {
  try {
    // 1. config.py 업데이트
    const cfg = await ghGet("config.py");
    let cfgContent = decodeURIComponent(escape(atob(cfg.content)));
    if (cfgContent.includes(`"${name}"`)) { showToast(`${name} 이미 등록됨`,"error"); return; }
    cfgContent = cfgContent.replace(
      `    "김학균", "김한진",
]`,
      `    "김학균", "김한진",
    "${name}",
]`
    );
    await ghUpdate("config.py", cfgContent, cfg.sha, `feat: 패널리스트 추가 — ${name}`);

    // 2. pending_names.json 상태 업데이트
    const { data, sha } = await readJson("data/pending_names.json");
    const updated = data.map(d => d.name === name ? {...d, status:"approved"} : d);
    await ghUpdate("data/pending_names.json", JSON.stringify(updated, null, 2), sha,
      `admin: 패널리스트 승인 — ${name}`);

    document.getElementById(`pn-${name}`)?.remove();
    showToast(`✅ ${name} 패널리스트 추가 완료`);
    const cnt = document.getElementById("panelist-cnt");
    cnt.textContent = Math.max(0, parseInt(cnt.textContent||0) - 1);
  } catch(e) { showToast(`오류: ${e.message}`, "error"); }
}

async function rejectPanelist(name) {
  try {
    const { data, sha } = await readJson("data/pending_names.json");
    const updated = data.map(d => d.name === name ? {...d, status:"rejected"} : d);
    await ghUpdate("data/pending_names.json", JSON.stringify(updated, null, 2), sha,
      `admin: 패널리스트 거절 — ${name}`);
    document.getElementById(`pn-${name}`)?.remove();
    showToast(`${name} 거절 처리`);
    const cnt = document.getElementById("panelist-cnt");
    cnt.textContent = Math.max(0, parseInt(cnt.textContent||0) - 1);
  } catch(e) { showToast(`오류: ${e.message}`, "error"); }
}

// ── 채널 후보 ─────────────────────────────────────────────────────
async function loadChannels() {
  const el = document.getElementById("channel-list");
  const { data, sha } = await readJson("data/pending_channels.json");
  const pending = data.filter(d => d.status === "pending")
                      .sort((a,b) => b.count - a.count);
  document.getElementById("channel-cnt").textContent = pending.length;
  if (!pending.length) { el.innerHTML = `<div class="empty">⭕ 승인 대기 중인 채널 후보가 없습니다.</div>`; return; }
  el.innerHTML = pending.map(ch => `
    <div class="card" id="ch-${encodeURIComponent(ch.channel_name)}">
      <div class="card-header">
        <span class="card-name">📺 ${ch.channel_name}</span>
        <span class="badge badge-blue">발견 ${ch.count}회</span>
        <span class="card-meta">${ch.first_seen} ~ ${ch.last_seen}</span>
      </div>
      <div class="card-body">
        ${ch.expert_appeared?.length ? `
          <div style="margin-bottom:.5rem;">
            <span style="font-size:.78rem;color:var(--muted);">출연 전문가:</span>
            ${ch.expert_appeared.map(e=>`<span class="expert-tag">${e}</span>`).join("")}
          </div>` : ""}
        <ul class="sample-list">
          ${(ch.sample_videos||[]).map(v=>`<li>▸ ${v}</li>`).join("")}
        </ul>
        <div class="btn-row" style="flex-wrap:wrap;">
          <select class="cat-select" id="cat-${encodeURIComponent(ch.channel_name)}">
            <option value="youtuber">유튜버</option>
            <option value="broadcast">경제방송</option>
            <option value="securities">증권사</option>
          </select>
          <input class="channel-id-input" id="chid-${encodeURIComponent(ch.channel_name)}"
            placeholder="채널 ID (UCxxxxx)" value="${ch.channel_id||''}">
          <button class="btn btn-approve btn-sm"
            onclick="approveChannel('${ch.channel_name}')">✅ 승인</button>
          <button class="btn btn-reject btn-sm"
            onclick="rejectChannel('${ch.channel_name}')">❌ 거절</button>
        </div>
        <div style="font-size:.74rem;color:var(--muted);margin-top:.4rem;">
          💡 채널 ID는 YouTube 채널 페이지 URL에서 확인 (UC로 시작)
        </div>
      </div>
    </div>`).join("");
}

async function approveChannel(chName) {
  const key     = encodeURIComponent(chName);
  const cat     = document.getElementById(`cat-${key}`)?.value || "youtuber";
  const chId    = document.getElementById(`chid-${key}`)?.value?.trim() || "";
  if (!chId) { showToast("채널 ID를 입력하세요", "error"); return; }
  try {
    // channels.json 업데이트
    const cj = await ghGet("channels.json");
    let channels = JSON.parse(decodeURIComponent(escape(atob(cj.content))));
    channels[cat] = channels[cat] || [];
    if (channels[cat].some(c => c.id === chId)) {
      showToast("이미 등록된 채널 ID", "error"); return;
    }
    channels[cat].push({ id: chId, name: chName });
    await ghUpdate("channels.json", JSON.stringify(channels, null, 2), cj.sha,
      `feat: 채널 추가 — ${chName} (${cat})`);

    // pending_channels.json 상태 업데이트
    const { data, sha } = await readJson("data/pending_channels.json");
    const updated = data.map(d => d.channel_name === chName ? {...d, status:"approved", channel_id:chId} : d);
    await ghUpdate("data/pending_channels.json", JSON.stringify(updated, null, 2), sha,
      `admin: 채널 승인 — ${chName}`);

    document.getElementById(`ch-${key}`)?.remove();
    showToast(`✅ ${chName} 채널 추가 완료 (${cat})`);
    const cnt = document.getElementById("channel-cnt");
    cnt.textContent = Math.max(0, parseInt(cnt.textContent||0) - 1);
  } catch(e) { showToast(`오류: ${e.message}`, "error"); }
}

async function rejectChannel(chName) {
  const key = encodeURIComponent(chName);
  try {
    const { data, sha } = await readJson("data/pending_channels.json");
    const updated = data.map(d => d.channel_name === chName ? {...d, status:"rejected"} : d);
    await ghUpdate("data/pending_channels.json", JSON.stringify(updated, null, 2), sha,
      `admin: 채널 거절 — ${chName}`);
    document.getElementById(`ch-${key}`)?.remove();
    showToast(`${chName} 거절 처리`);
    const cnt = document.getElementById("channel-cnt");
    cnt.textContent = Math.max(0, parseInt(cnt.textContent||0) - 1);
  } catch(e) { showToast(`오류: ${e.message}`, "error"); }
}

// ── 등록 현황 ─────────────────────────────────────────────────────
async function loadRegistered() {
  const el = document.getElementById("registered-content");
  try {
    const [cfgData, cjData] = await Promise.all([
      ghGet("config.py"), ghGet("channels.json")
    ]);
    const cfgContent = decodeURIComponent(escape(atob(cfgData.content)));
    const channels   = JSON.parse(decodeURIComponent(escape(atob(cjData.content))));

    // 패널리스트 목록 파싱
    const pMatch = cfgContent.match(/POPULAR_PANELISTS\s*=\s*\[([\s\S]*?)\]/);
    const panelists = pMatch
      ? [...pMatch[1].matchAll(/"([^"]+)"/g)].map(m => m[1])
      : [];

    const catLabel = { broadcast:"경제방송", youtuber:"유튜버", securities:"증권사" };
    let html = `
      <div style="margin-bottom:1.5rem;">
        <div class="section-title" style="margin-bottom:.75rem;">
          👤 패널리스트 (${panelists.length}명)
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:.4rem;">
          ${panelists.map(p=>`<span class="expert-tag" style="background:var(--surface2);color:var(--accent);border:1px solid var(--border);">${p}</span>`).join("")}
        </div>
      </div>
      <div>
        <div class="section-title" style="margin-bottom:.75rem;">📺 등록 채널</div>`;

    for (const [cat, label] of Object.entries(catLabel)) {
      const chs = channels[cat] || [];
      html += `
        <div style="margin-bottom:1.2rem;">
          <div style="font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:.5rem;">
            ${label} (${chs.length}개)
          </div>
          <table class="registered-table">
            <thead><tr><th>채널명</th><th>채널 ID</th></tr></thead>
            <tbody>
              ${chs.map(c=>`<tr><td>${c.name||c}</td><td style="color:var(--muted);font-size:.78rem;">${c.id||""}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }
    html += `</div>`;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="empty" style="color:var(--red);">로드 실패: ${e.message}</div>`;
  }
}
</script>
