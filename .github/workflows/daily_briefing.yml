name: Daily Stock Briefing v3

on:
  schedule:
    - cron: '0 22 * * 0-4'    # KST 월~금 07:00 (UTC 전날 22:00) — retry 루프가 08:00까지 대기
  workflow_dispatch:
    inputs:
      force_run:
        description: '강제 실행'
        required: false
        default: 'false'
        type: boolean
      skip_youtube:
        description: 'YouTube 수집 스킵'
        required: false
        default: 'false'
        type: boolean
      skip_analyst:
        description: '애널리스트 수집 스킵'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # retry 루프 최대 90분 + 브리핑 생성 30분

    steps:
      - name: 🔁 중복 실행 체크
        id: duplicate_check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          python - <<'EOF'
          import os, urllib.request, json
          from datetime import datetime, timezone, timedelta

          force_run = os.getenv("FORCE_RUN", "false").lower() == "true"
          if force_run:
              print("⚡ force_run=true → 중복 체크 스킵")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("duplicate=false\n")
              exit(0)

          KST = timezone(timedelta(hours=9))
          today = datetime.now(KST).strftime("%Y-%m-%d")
          current_run_id = os.getenv("GITHUB_RUN_ID", "")
          token = os.getenv("GH_TOKEN", "")
          repo = os.getenv("GITHUB_REPOSITORY", "")

          url = f"https://api.github.com/repos/{repo}/actions/workflows/daily_briefing.yml/runs?status=success&per_page=10"
          req = urllib.request.Request(url, headers={
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          })
          try:
              with urllib.request.urlopen(req) as res:
                  data = json.loads(res.read())
              runs = data.get("workflow_runs", [])
              for run in runs:
                  run_date = run["created_at"][:10]
                  run_id = str(run["id"])
                  if run_date == today and run_id != current_run_id:
                      print(f"⚠️  오늘({today}) 이미 성공한 실행 발견 (run_id: {run_id}) → 중복 종료")
                      with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                          f.write("duplicate=true\n")
                      exit(0)
              print(f"✅ 오늘({today}) 중복 실행 없음 → 계속 진행")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("duplicate=false\n")
          except Exception as e:
              print(f"⚠️  중복 체크 실패 ({e}) → 안전하게 계속 진행")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("duplicate=false\n")
          EOF

      - name: 🛑 중복 실행 시 종료
        if: steps.duplicate_check.outputs.duplicate == 'true'
        run: |
          echo "오늘 이미 브리핑이 생성되었습니다. 워크플로우를 종료합니다."
          exit 0

      - name: 📥 저장소 체크아웃
        if: steps.duplicate_check.outputs.duplicate != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python 환경 설정
        if: steps.duplicate_check.outputs.duplicate != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 🖋️ 시스템 의존성 설치 (한글 폰트)
        if: steps.duplicate_check.outputs.duplicate != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            fonts-nanum \
            fonts-nanum-coding \
            libfreetype6-dev \
            libpng-dev \
            pkg-config
          fc-cache -fv || true

      - name: 📦 Python 패키지 설치
        if: steps.duplicate_check.outputs.duplicate != 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 API 키 점검
        if: steps.duplicate_check.outputs.duplicate != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN:          ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'EOF'
          import os, sys
          keys = {
              "ANTHROPIC_API_KEY": os.getenv("ANTHROPIC_API_KEY"),
              "YOUTUBE_API_KEY":   os.getenv("YOUTUBE_API_KEY"),
              "GH_TOKEN":          os.getenv("GH_TOKEN"),
          }
          missing = [k for k, v in keys.items() if not v]
          for k in missing:
              print(f"⚠️  {k} 누락")
          if "ANTHROPIC_API_KEY" in missing:
              print("❌ ANTHROPIC_API_KEY 없음 → 실행 중단")
              sys.exit(1)
          print("✅ 필수 키 확인 완료")
          EOF

      - name: 🎨 Matplotlib 백엔드 설정
        if: steps.duplicate_check.outputs.duplicate != 'true'
        run: |
          mkdir -p ~/.config/matplotlib
          echo "backend: Agg" > ~/.config/matplotlib/matplotlibrc

      - name: 📊 브리핑 생성 실행
        if: steps.duplicate_check.outputs.duplicate != 'true'
        id: run_briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN:          ${{ secrets.GH_TOKEN }}
          ADMIN_PASSWORD:    ${{ secrets.ADMIN_PASSWORD }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          SKIP_YOUTUBE:      ${{ github.event.inputs.skip_youtube || 'false' }}
          SKIP_ANALYST:      ${{ github.event.inputs.skip_analyst || 'false' }}
          MPLBACKEND:        Agg
        run: |
          python main.py
          echo "briefing_generated=true" >> $GITHUB_OUTPUT

      - name: ✅ 결과물 검증
        if: steps.duplicate_check.outputs.duplicate != 'true'
        run: |
          if [ ! -f docs/index.html ]; then
            echo "❌ docs/index.html 없음"
            exit 1
          fi
          SIZE=$(wc -c < docs/index.html)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ docs/index.html 너무 작음 (${SIZE} bytes)"
            exit 1
          fi
          echo "✅ docs/index.html 정상 (${SIZE} bytes)"
          ARCHIVE_COUNT=$(ls docs/archive/*.html 2>/dev/null | wc -l)
          echo "📚 아카이브 파일 수: ${ARCHIVE_COUNT}"

      - name: 🚀 변경사항 커밋 및 푸시
        id: commit_push
        if: steps.duplicate_check.outputs.duplicate != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ data/ || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️  변경사항 없음 → 커밋 스킵"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "📊 브리핑 자동 업데이트: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            for i in 1 2 3; do
              git push && break || {
                echo "⚠️  push 실패 (${i}회) → rebase 후 재시도"
                sleep 3
                git pull --rebase origin main || true
              }
            done
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📡 영상 생성 파이프라인 트리거 (stock-briefing-video)
        if: steps.duplicate_check.outputs.duplicate != 'true' && steps.commit_push.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          response=$(curl -sS -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/kunil-choi/stock-briefing-video/actions/workflows/daily_broadcast.yml/dispatches \
            -d '{"ref":"main"}')
          if [ "$response" != "204" ]; then
            echo "❌ stock-briefing-video dispatch 실패 (HTTP ${response})"
            cat /tmp/dispatch_resp.txt
            exit 1
          fi
          echo "✅ stock-briefing-video의 daily_broadcast.yml 트리거 완료"

      - name: 📋 실행 요약 (항상 출력)
        if: always()
        run: |
          echo "=============================="
          echo "KST 현재시각: $(TZ='Asia/Seoul' date)"
          if [ -f docs/index.html ]; then
            echo "index.html 크기: $(wc -c < docs/index.html) bytes"
          else
            echo "index.html: 없음"
          fi
          if [ -f data/briefing_data.json ]; then
            python - <<'EOF'
          import json
          try:
              d = json.load(open("data/briefing_data.json", encoding="utf-8"))
              stocks = len(d.get("stocks", []))
              picks  = len(d.get("hidden_picks", []))
              print(f"관심종목: {stocks}개 / 오늘의픽: {picks}개")
          except Exception as e:
              print(f"briefing_data.json 파싱 실패: {e}")
          EOF
          else
            echo "briefing_data.json: 없음"
          fi
          echo "=============================="
