name: Daily Stock Briefing v3

on:
  schedule:
    - cron: '0 21 * * 0-4'   # KST 월~금 06:00 (UTC 전날 21:00)
  workflow_dispatch:
    inputs:
      force_run:
        description: '강제 실행'
        required: false
        default: 'false'
        type: boolean
      skip_youtube:
        description: 'YouTube 수집 스킵'
        required: false
        default: 'false'
        type: boolean
      skip_analyst:
        description: '애널리스트 수집 스킵'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 🖋️ 시스템 의존성 설치 (한글 폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            fonts-nanum \
            fonts-nanum-coding \
            libfreetype6-dev \
            libpng-dev \
            pkg-config
          fc-cache -fv || true

      - name: 📦 Python 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 API 키 점검
        run: |
          python - <<'EOF'
          import os, sys
          keys = {
              "ANTHROPIC_API_KEY": os.getenv("ANTHROPIC_API_KEY"),
              "YOUTUBE_API_KEY":   os.getenv("YOUTUBE_API_KEY"),
              "GH_TOKEN":          os.getenv("GH_TOKEN"),
          }
          missing = [k for k, v in keys.items() if not v]
          for k in missing:
              print(f"⚠️  {k} 누락")
          if "ANTHROPIC_API_KEY" in missing:
              print("❌ ANTHROPIC_API_KEY 없음 → 실행 중단")
              sys.exit(1)
          print("✅ 필수 키 확인 완료")
          EOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN:          ${{ secrets.GH_TOKEN }}

      - name: 🎨 Matplotlib 백엔드 설정
        run: |
          mkdir -p ~/.config/matplotlib
          echo "backend: Agg" > ~/.config/matplotlib/matplotlibrc

      - name: 📊 브리핑 생성 실행
        id: run_briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN:          ${{ secrets.GH_TOKEN }}
          ADMIN_PASSWORD:    ${{ secrets.ADMIN_PASSWORD }}
          SKIP_YOUTUBE:      ${{ github.event.inputs.skip_youtube || 'false' }}
          SKIP_ANALYST:      ${{ github.event.inputs.skip_analyst || 'false' }}
          MPLBACKEND:        Agg
        run: |
          python main.py
          echo "briefing_generated=true" >> $GITHUB_OUTPUT

      - name: ✅ 결과물 검증
        run: |
          if [ ! -f docs/index.html ]; then
            echo "❌ docs/index.html 없음"
            exit 1
          fi
          SIZE=$(wc -c < docs/index.html)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ docs/index.html 너무 작음 (${SIZE} bytes)"
            exit 1
          fi
          echo "✅ docs/index.html 정상 (${SIZE} bytes)"
          ARCHIVE_COUNT=$(ls docs/archive/*.html 2>/dev/null | wc -l)
          echo "📚 아카이브 파일 수: ${ARCHIVE_COUNT}"

      - name: 🚀 변경사항 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ data/ || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️  변경사항 없음 → 커밋 스킵"
          else
            git commit -m "📊 브리핑 자동 업데이트: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            for i in 1 2 3; do
              git push && break || {
                echo "⚠️  push 실패 (${i}회) → rebase 후 재시도"
                sleep 3
                git pull --rebase origin main || true
              }
            done
          fi

      - name: 📋 실행 요약 (항상 출력)
        if: always()
        run: |
          echo "=============================="
          echo "KST 현재시각: $(TZ='Asia/Seoul' date)"
          if [ -f docs/index.html ]; then
            echo "index.html 크기: $(wc -c < docs/index.html) bytes"
          else
            echo "index.html: 없음"
          fi
          if [ -f data/briefing_data.json ]; then
            python - <<'EOF'
          import json
          try:
              d = json.load(open("data/briefing_data.json", encoding="utf-8"))
              stocks = len(d.get("stocks", []))
              picks  = len(d.get("hidden_picks", []))
              print(f"관심종목: {stocks}개 / 오늘의픽: {picks}개")
          except Exception as e:
              print(f"briefing_data.json 파싱 실패: {e}")
          EOF
          else
            echo "briefing_data.json: 없음"
          fi
          echo "=============================="
