name: Daily Stock Briefing v3

on:
  schedule:
    # 매일 오전 6시 KST (UTC 21:00 전날) - 월~금 실행
    - cron: '0 21 * * 0-4'
  workflow_dispatch:
    inputs:
      force_run:
        description: '강제 실행 여부'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 시스템 의존성 설치 (한글 폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum fonts-nanum-coding libfreetype6-dev pkg-config

      - name: Python 패키지 설치
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: 브리핑 생성 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python main.py

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ data/ || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "📊 브리핑 자동 업데이트: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" && git push)
