name: 월간 신규 채널 탐색

on:
  schedule:
    - cron: '0 1 1 * *'   # 매월 1일 10:00 KST
  workflow_dispatch:        # 수동 실행 가능

permissions:
  contents: write

jobs:
  channel-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 패키지 설치
        run: pip install -r requirements.txt

      - name: 🔍 신규 채널 탐색
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collectors/channel_scout.py

      - name: 💾 결과 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/pending_channels.json || true
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "🔍 월간 채널 탐색: $(TZ='Asia/Seoul' date +'%Y-%m')"
            git push
          fi

      - name: 📋 요약
        if: always()
        run: |
          if [ -f data/pending_channels.json ]; then
            python3 -c "import json; d=json.load(open('data/pending_channels.json')); pending=[x for x in d if x.get('status')=='pending']; print(f'채널 후보 대기: {len(pending)}건')"
          fi
